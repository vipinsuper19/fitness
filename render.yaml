# Render Blueprint for the fitness API (Render Free + Supabase Free).
# No secret values live here: every `sync: false` var is entered in the
# Render dashboard when the Blueprint is applied. See docs/DEPLOY.md.
services:
  - type: web
    name: fitness-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    branch: main
    autoDeploy: false
    # --include=dev: prisma CLI + typescript are devDependencies and are
    # needed at build time even though NODE_ENV=production.
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    # Free plan has no pre-deploy command, so migrate on start (idempotent).
    startCommand: npm run migrate:deploy && npm start
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SWAGGER_ENABLED
        value: "false"
      # Supabase session pooler (port 5432, IPv4) for both.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
