              schema: { $ref: '#/components/schemas/BodyMeasurement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /body-measurements/{measurementId}:
    parameters:
      - $ref: '#/components/parameters/MeasurementId'
    get:
      tags: [progress]
      operationId: getBodyMeasurement
      summary: Get a body measurement
      responses:
        '200':
          description: Measurement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BodyMeasurement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [progress]
      operationId: updateBodyMeasurement
      summary: Edit a body measurement
      description: 'Partial update, like the profile. `Idempotency-Key` is optional: with one, a retry with the same body replays the stored 200 (`Idempotent-Replayed: true`) and a different body under the same key is `409 IDEMPOTENCY_KEY_REUSED`; without one, a retry just applies the same values again. An empty body `{}` is rejected with 400. A field left out stays unchanged; `null` clears a measurement. After the change the entry must still have at least one measurement, otherwise 400 VALIDATION_FAILED (fields name the cleared measurements).'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BodyMeasurementUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BodyMeasurement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
    delete:
      tags: [progress]
      operationId: deleteBodyMeasurement
      summary: Delete a body measurement
      description: '`Idempotency-Key` is optional. With one, a retry replays `204` (`Idempotent-Replayed: true`) even though the entry is gone; without one, deleting it again is `404`.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /progress/summary:
    get:
      tags: [progress]
      operationId: getProgressSummary
      summary: Progress over a date range
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      description: Days are local dates in the profile timezone. `from` must be on or before `to`, and the range can cover at most 366 days (otherwise `400`). `xpEarned` counts XP from workouts completed that day (by the session's local `completedAt`), excluding awards that were later reversed. Dates must be within years 1900–2100. Every day of the range is returned (see `points`). When several body measurements share a date, each series (`weightKg`, `bodyFatPct`, `waistCm`) takes its value from the latest entry that day that has one (by `createdAt`, then id). `waterMl` is the sum of that day's water log.
      responses:
        '200':
          description: One point per day; `null` means no data that day, never 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /progress/exercises:
    get:
      tags: [progress]
      operationId: listExerciseProgress
      summary: Strength progress per exercise (exercises performed in the range, with all-time records)
      description: |
        Read-only; no XP and no Idempotency-Key. Same range rules as `/progress/summary`: `from` and `to`
        required, `from` ≤ `to`, at most 366 days, dates within years 1900–2100 (otherwise `400`).
        A set counts only if it is `completed` in a `completed` session; discarded sessions are gone and
        corrected sets count as corrected. A session's local date is its `completedAt` in the profile timezone.
        Lists exercises with at least one counting set in the range, most recently performed first
        (`lastPerformedAt` desc, then `exerciseId`), paged with `cursor`/`limit`. `sessions` and
        `lastPerformedAt` are within the range; `pr` is **all-time** (see `PersonalRecords`).
        Rules: `docs/specs/strength-progress.md`.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of exercises
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [from, to, timezone, items]
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      timezone: { type: string, description: Profile timezone used for local dates }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ExerciseProgressSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /progress/exercises/{exerciseId}:
    get:
      tags: [progress]
      operationId: getExerciseProgress
      summary: One exercise's progress by day, week or month, with all-time records
      description: |
        Read-only; same range rules and counting rules as `GET /progress/exercises`. `week` periods start on
        Monday and `month` periods are calendar months; the first and last periods are clipped to `from`/`to`,
        and `period` is the first date of the (clipped) period. Every period in the range is returned, in date
        order; a period with no counting set has `sessions: 0`, `sets: 0` and every other value `null`.
        An exercise the user never performed is `200` with all-null `pr` and empty periods; an unknown id is `404`.
      parameters:
        - $ref: '#/components/parameters/ExerciseId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: bucket
          in: query
          required: false
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        '200':
          description: One point per period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseProgress' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /xp/balance:
    get:
      tags: [xp]
      operationId: getXpBalance
      summary: XP balance and level
      responses:
        '200':
          description: Server-computed balance and level
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XpBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /xp/ledger:
    get:
      tags: [xp]
      operationId: listXpLedger
      summary: XP ledger (read-only)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ledger entries, newest first (read-only)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/XpTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /badges:
    get:
      tags: [badges]
      operationId: listBadges
      summary: Badge catalog with the user's earned state and progress
      description: |
        Every badge in the server's catalog, earned or not, in a stable catalog order. Badges are
        awarded only by the server, at the write that satisfies the rule or by the release
        backfill, which this call may run lazily, so a fresh account can see badges earned from its existing history.
        An earned badge is never revoked. Its bonus XP is a ledger entry with `sourceType: badge`.
        Days are local dates in the profile timezone (default `Asia/Kolkata`). Client-dated food, water
        and measurement entries count only when created on that local day or the next one.
      responses:
        '200':
          description: Catalog with earned state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BadgeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /challenges/templates:
    get:
      tags: [challenges]
      operationId: listChallengeTemplates
      summary: Built-in challenge templates and their allowed targets
      responses:
        '200':
          description: Templates (no user-defined rules)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ChallengeTemplate' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /challenges:
    get:
      tags: [challenges]
      operationId: listChallenges
      summary: The user's challenges, newest first
      description: Re-evaluates first (progress, completion, expiry), so the list is current even if a background evaluation was missed. Expired challenges are marked `expired` when read (the server has no scheduler).
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ChallengeStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of challenges
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Challenge' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [challenges]
      operationId: joinChallenge
      summary: Join a challenge from a built-in template
      description: |
        A `weekly` challenge covers the current week (Monday to Sunday, local, in the profile timezone) and counts
        that week's activity, including activity before joining. A `personal` challenge starts today
        and ends after the template's `deadlineDays` entry for the chosen target. The timezone and the water goal (the profile's
        `dailyWaterTargetMl`, else 2000 ml) are captured at join.
        Errors (409): `CHALLENGE_ALREADY_JOINED` means there is already an active challenge from this template, or
        this week's weekly instance was already joined (also after leaving it); `CHALLENGE_LIMIT_REACHED`
        means 5 challenges are active. An unknown template or a target not allowed by it is `400 VALIDATION_FAILED`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeJoinRequest' }
      responses:
        '201':
          description: Joined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`CHALLENGE_ALREADY_JOINED`, `CHALLENGE_LIMIT_REACHED`, `IDEMPOTENCY_KEY_REUSED` or `IDEMPOTENCY_IN_PROGRESS`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /challenges/{challengeId}:
    parameters:
      - $ref: '#/components/parameters/ChallengeId'
    get:
      tags: [challenges]
      operationId: getChallenge
      summary: One challenge with current progress
      responses:
        '200':
          description: Challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /challenges/{challengeId}/leave:
    parameters:
      - $ref: '#/components/parameters/ChallengeId'
    post:
      tags: [challenges]
      operationId: leaveChallenge
      summary: Leave an active challenge (no XP)
      description: 'Leaving one that is already `left` is a 200 no-op. A `completed` or `expired` challenge cannot be left: `409 CHALLENGE_NOT_ACTIVE`. `Idempotency-Key` is optional; with one, a retry replays the stored response.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Left
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`CHALLENGE_NOT_ACTIVE`, `IDEMPOTENCY_KEY_REUSED` or `IDEMPOTENCY_IN_PROGRESS`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /auth/login, /auth/register or /auth/refresh (15 minutes).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client UUID that makes a retry safe. See the conventions above.
      schema: { type: string, format: uuid }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Required here because the client retries this write from offline sync, or it can award XP.
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    DateRequired:
      name: date
      in: query
      required: true
      description: Local date in the user's timezone
      schema: { type: string, format: date }
    GoalId:
      name: goalId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ExerciseId:
      name: exerciseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ClientSetId:
      name: clientSetId
      in: path
      required: true
      description: The device-generated set UUID used by the set upsert
      schema: { type: string, format: uuid }
    FoodId:
      name: foodId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    FoodLogId:
      name: foodLogId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    WaterLogId:
      name: waterLogId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    MeasurementId:
      name: measurementId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }

  headers:
    RetryAfter:
      description: Seconds to wait before retrying
      schema: { type: integer, minimum: 1 }

  responses:
    ValidationError:
      description: '`VALIDATION_FAILED`; `details.fields` maps field paths to messages'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '`UNAUTHENTICATED` (missing or bad token) or `TOKEN_EXPIRED` (refresh and retry)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`NOT_FOUND`, including another user''s resource'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdempotencyConflict:
      description: '`IDEMPOTENCY_KEY_REUSED` (different body, method or path; never replayed) or `IDEMPOTENCY_IN_PROGRESS`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: '`RATE_LIMITED`'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Id:
      type: string
      format: uuid
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: Stable machine code (UPPER_SNAKE_CASE). Clients branch on this, not on `message`.
          examples: [VALIDATION_FAILED, NOT_FOUND, IDEMPOTENCY_KEY_REUSED, NO_MATCHING_EXERCISES, EXERCISE_CATALOG_EMPTY]
        message:
          type: string
          description: Human-readable, safe to show
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; null on the last page

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Hashed with argon2id; never stored or logged in clear
        displayName: { type: string, minLength: 1, maxLength: 60 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 512 }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn:
          type: integer
          description: Access token lifetime in seconds (900)
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        displayName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }

    Sex:
      type: string
      enum: [male, female, other, prefer_not_to_say]
    ActivityLevel:
      type: string
      enum: [sedentary, light, moderate, active, very_active]
    ExperienceLevel:
      type: string
      enum: [beginner, intermediate, advanced]
    UnitSystem:
      type: string
      enum: [metric, imperial]
      description: Display preference only; the API always uses metric
    DietPreference:
      type: string
      enum: [vegetarian, eggetarian, non_vegetarian, vegan, jain]
    Profile:
      type: object
      required: [userId, unitSystem, timezone, locale, currency, onboardingCompleted, updatedAt]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        displayName: { type: [string, 'null'], maxLength: 60 }
        birthYear: { type: [integer, 'null'], minimum: 1900, maximum: 2100 }
        sex: { oneOf: [{ $ref: '#/components/schemas/Sex' }, { type: 'null' }] }
        heightCm: { type: [number, 'null'], minimum: 50, maximum: 272 }
        weightKg: { type: [number, 'null'], minimum: 20, maximum: 400 }
        activityLevel: { oneOf: [{ $ref: '#/components/schemas/ActivityLevel' }, { type: 'null' }] }
        experienceLevel: { oneOf: [{ $ref: '#/components/schemas/ExperienceLevel' }, { type: 'null' }] }
        dietPreference: { oneOf: [{ $ref: '#/components/schemas/DietPreference' }, { type: 'null' }] }
        unitSystem: { $ref: '#/components/schemas/UnitSystem' }
        timezone: { type: string, default: Asia/Kolkata, description: IANA timezone }
        locale: { type: string, default: en-IN }
        currency: { type: string, const: INR }
        dailyCalorieTargetKcal: { type: [integer, 'null'], minimum: 800, maximum: 6000 }
        dailyWaterTargetMl: { type: [integer, 'null'], minimum: 250, maximum: 10000 }
        dailyProteinTargetG: { type: [integer, 'null'], minimum: 0, maximum: 1000, description: 'Daily protein target in grams (integer, 0–1000). Explicit only: never derived from the calorie target. 0 or null means no target.' }
        dailyCarbsTargetG: { type: [integer, 'null'], minimum: 0, maximum: 1000, description: 'Daily carbs target in grams (integer, 0–1000). Explicit only: never derived from the calorie target. 0 or null means no target.' }
        dailyFatTargetG: { type: [integer, 'null'], minimum: 0, maximum: 1000, description: 'Daily fat target in grams (integer, 0–1000). Explicit only: never derived from the calorie target. 0 or null means no target.' }
        onboardingCompleted: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      description: Every field is optional so onboarding can be skipped and resumed. A null clears the value.
      properties:
        displayName: { type: [string, 'null'], maxLength: 60 }
        birthYear: { type: [integer, 'null'], minimum: 1900, maximum: 2100 }
        sex: { oneOf: [{ $ref: '#/components/schemas/Sex' }, { type: 'null' }] }
        heightCm: { type: [number, 'null'], minimum: 50, maximum: 272 }
        weightKg: { type: [number, 'null'], minimum: 20, maximum: 400 }
        activityLevel: { oneOf: [{ $ref: '#/components/schemas/ActivityLevel' }, { type: 'null' }] }
        experienceLevel: { oneOf: [{ $ref: '#/components/schemas/ExperienceLevel' }, { type: 'null' }] }
        dietPreference: { oneOf: [{ $ref: '#/components/schemas/DietPreference' }, { type: 'null' }] }
        unitSystem: { $ref: '#/components/schemas/UnitSystem' }
        timezone: { type: string, maxLength: 64 }
        dailyCalorieTargetKcal: { type: [integer, 'null'], minimum: 800, maximum: 6000 }
        dailyWaterTargetMl: { type: [integer, 'null'], minimum: 250, maximum: 10000 }
        dailyProteinTargetG: { type: [integer, 'null'], minimum: 0, maximum: 1000, description: 'Daily protein target in grams (integer, 0–1000). Explicit only: never derived from the calorie target. 0 or null means no target.' }
        dailyCarbsTargetG: { type: [integer, 'null'], minimum: 0, maximum: 1000, description: 'Daily carbs target in grams (integer, 0–1000). Explicit only: never derived from the calorie target. 0 or null means no target.' }
        dailyFatTargetG: { type: [integer, 'null'], minimum: 0, maximum: 1000, description: 'Daily fat target in grams (integer, 0–1000). Explicit only: never derived from the calorie target. 0 or null means no target.' }
        onboardingCompleted: { type: boolean }
    DataExport:
      type: object
      required: [exportedAt, user]
      properties:
        exportedAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
        profile: { $ref: '#/components/schemas/Profile' }
        goals: { type: array, items: { $ref: '#/components/schemas/Goal' } }
        workoutPlans: { type: array, items: { $ref: '#/components/schemas/WorkoutPlan' } }
        workoutSessions: { type: array, items: { $ref: '#/components/schemas/WorkoutSession' } }
        customFoods:
          type: array
          description: All of the user's custom foods, including soft-deleted ones (with `deletedAt`), so every `foodLogs[].foodId` that refers to a custom food resolves.
          items: { $ref: '#/components/schemas/ExportedFood' }
        foodLogs: { type: array, items: { $ref: '#/components/schemas/FoodLog' } }
        waterLogs: { type: array, items: { $ref: '#/components/schemas/WaterLog' } }
        bodyMeasurements: { type: array, items: { $ref: '#/components/schemas/BodyMeasurement' } }
        xpLedger: { type: array, items: { $ref: '#/components/schemas/XpTransaction' } }
        badges: { type: array, items: { $ref: '#/components/schemas/ExportedBadge' }, description: Earned badges }
        challenges: { type: array, items: { $ref: '#/components/schemas/Challenge' }, description: 'All challenges, any status' }
        truncated:
          type: array
          items: { type: string }
          description: Collections cut at their cap, e.g. `foodLogs`, `workoutSessions.sets` or `workoutPlans.exercises`; empty when complete.

    GoalType:
      type: string
      enum: [lose_weight, gain_muscle, maintain, improve_endurance, workouts_per_week]
    GoalStatus:
      type: string
      enum: [active, achieved, abandoned]
    Goal:
      type: object
      required: [id, type, status, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/GoalType' }
        status: { $ref: '#/components/schemas/GoalStatus' }
        targetValue: { type: [number, 'null'], description: 'kg for weight goals, count for workouts_per_week' }
        startValue: { type: [number, 'null'] }
        targetDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GoalCreate:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/GoalType' }
        targetValue: { type: [number, 'null'], minimum: 0 }
        startValue: { type: [number, 'null'], minimum: 0 }
        targetDate: { type: [string, 'null'], format: date }
    GoalUpdate:
      type: object
      properties:
        status: { $ref: '#/components/schemas/GoalStatus' }
        targetValue: { type: [number, 'null'], minimum: 0 }
        targetDate: { type: [string, 'null'], format: date }

    MuscleGroup:
      type: string
      enum: [chest, back, shoulders, biceps, triceps, forearms, core, quads, hamstrings, glutes, calves, full_body, cardio]
    Equipment:
      type: string
      enum: [none, dumbbell, barbell, kettlebell, machine, cable, resistance_band, bench, pull_up_bar, other]
    TrackingType:
      type: string
      enum: [reps_weight, reps, duration, distance_duration]
      description: Which set fields apply
    Exercise:
      type: object
      required: [id, slug, name, primaryMuscle, secondaryMuscles, equipment, trackingType, difficulty]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { type: string }
        name: { type: string }
        nameHi: { type: [string, 'null'], description: Hindi name }
        primaryMuscle: { $ref: '#/components/schemas/MuscleGroup' }
        secondaryMuscles: { type: array, items: { $ref: '#/components/schemas/MuscleGroup' } }
        equipment: { type: array, items: { $ref: '#/components/schemas/Equipment' } }
        trackingType: { $ref: '#/components/schemas/TrackingType' }
        difficulty: { $ref: '#/components/schemas/ExperienceLevel' }
        instructions: { type: array, items: { type: string } }
        videoUrl: { type: [string, 'null'], format: uri }

    PlanGenerateRequest:
      type: object
      required: [goal, experienceLevel, daysPerWeek, sessionMinutes]
      properties:
        goal: { $ref: '#/components/schemas/GoalType' }
        experienceLevel: { $ref: '#/components/schemas/ExperienceLevel' }
        daysPerWeek: { type: integer, minimum: 1, maximum: 7 }
        sessionMinutes: { type: integer, minimum: 15, maximum: 180 }
        equipment:
          type: array
          items: { $ref: '#/components/schemas/Equipment' }
          description: Available equipment; empty or omitted means bodyweight only
        weeks: { type: integer, minimum: 1, maximum: 16, default: 4 }
    PlannedExercise:
      type: object
      required: [exerciseId, order, sets]
      properties:
        exerciseId: { $ref: '#/components/schemas/Id' }
        order: { type: integer, minimum: 0 }
        sets: { type: integer, minimum: 1, maximum: 20 }
        repsMin: { type: [integer, 'null'], minimum: 1, maximum: 100 }
        repsMax: { type: [integer, 'null'], minimum: 1, maximum: 100 }
        durationSeconds: { type: [integer, 'null'], minimum: 1, maximum: 7200 }
        targetWeightKg: { type: [number, 'null'], minimum: 0, maximum: 1000 }
        restSeconds: { type: integer, minimum: 0, maximum: 600, default: 90 }
        notes: { type: [string, 'null'], maxLength: 500 }
    PlannedWorkout:
      type: object
      required: [dayOfWeek, name, exercises]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        dayOfWeek: { type: integer, minimum: 1, maximum: 7, description: 'ISO weekday, 1 = Monday' }
        name: { type: string, maxLength: 80 }
        exercises:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/PlannedExercise' }
    WorkoutPlanDraft:
      $ref: './schemas/workout-plan-draft.schema.json'
    WorkoutPlanUpdate:
      allOf:
        - $ref: '#/components/schemas/WorkoutPlanDraft'
        - type: object
          required: [baseVersion]
          properties:
            baseVersion: { type: integer, minimum: 1 }
    PlanStatus:
      type: string
      enum: [active, paused, inactive, archived]
      description: |
        Derived from stored fields, in this order: `archived` = `archivedAt` set; `active` =
        the profile's active plan; `paused` = `pausedAt` set; else `inactive`. New values
        may be added; treat unknown values as `inactive`.
    PlanActivate:
      type: object
      additionalProperties: false
      properties:
        resume: { type: boolean, default: false, description: Continue a paused plan's week count instead of restarting at week 1 }
    WorkoutPlanSummary:
      type: object
      required: [id, name, source, version, status, isActive, currentWeek, totalWeeks, activatedAt, pausedAt, archivedAt, createdAt, completedSessions]
      description: Everything the plan list shows, so it needs no per-plan GET.
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, description: Name of the latest version }
        source: { type: string, enum: [rule_based, custom] }
        version: { type: integer, minimum: 1, description: Latest version number }
        status: { $ref: '#/components/schemas/PlanStatus' }
        isActive: { type: boolean, description: Same as `status == active` }
        currentWeek: { type: [integer, 'null'], minimum: 1, description: 'Same rule as `WorkoutPlan.currentWeek`; null unless active' }
        totalWeeks: { type: integer, minimum: 1, description: '`weeks` of the latest version' }
        activatedAt: { type: [string, 'null'], format: date-time, description: Same as `WorkoutPlan.activatedAt` (shifted on resume) }
        pausedAt: { type: [string, 'null'], format: date-time, description: When the plan was paused; null unless paused (kept on archive) }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        completedSessions: { type: integer, minimum: 0, description: 'Completed sessions logged against any version of this plan (discarded sessions excluded)' }
    WorkoutPlan:
      type: object
      required: [id, version, name, weeks, workouts, isActive, source, createdAt, activatedAt, currentWeek, planEnded]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        weeks: { type: integer }
        rationale:
          type: [string, 'null']
          maxLength: 1000
          description: Optional rule-based explanation of the plan (split, volume, equipment), shown to users. Null for plans saved without one.
        workouts: { type: array, items: { $ref: '#/components/schemas/PlannedWorkout' } }
        isActive: { type: boolean }
        source: { type: string, enum: [rule_based, custom] }
        createdAt: { type: string, format: date-time }
        activatedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the plan last became the user's active plan; null if never activated.
            Re-activating the already active plan keeps it, and it stays set after another
            plan becomes active (use `isActive` for the current state). Plans that were
            active before this field existed report their `createdAt` (a lower bound).
        pausedAt:
          type: [string, 'null']
          format: date-time
          description: Set by deactivate while the plan was active; cleared on activate. Optional for backward compatibility; servers always send it.
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: Set when the plan was archived (`DELETE /workout-plans/{planId}`); null otherwise. Optional for backward compatibility; servers always send it.
        currentWeek:
          type: [integer, 'null']
          minimum: 1
          description: |
            1-based week of the active plan, counted in local calendar days in the profile
            timezone (default `Asia/Kolkata`, same as the progress summary): the activation
            day starts week 1 and every 7 local days later adds one. Capped at `weeks`
            (see `planEnded`). Null unless this is the active plan, and also null if its `activatedAt` is null.
        planEnded:
          type: [boolean, 'null']
          description: True once the active plan's last week is over (then `currentWeek` stays at `weeks`). Null unless this is the active plan, and also null if its `activatedAt` is null. With no active plan (after deactivate or archive), every plan reports both as null.

    SessionStatus:
      type: string
      enum: [in_progress, paused, completed]
    SessionStart:
      type: object
      properties:
        plannedWorkoutId: { $ref: '#/components/schemas/Id' }
        planVersion: { type: integer, minimum: 1 }
        startedAt:
          type: string
          format: date-time
          description: Client time for offline starts; defaults to server time. Must be within the last 24 hours (up to 5 minutes ahead is allowed for clock skew); otherwise `400 VALIDATION_FAILED` with `details.fields.startedAt`.
    SessionUpdate:
      type: object
      properties:
        status: { type: string, enum: [in_progress, paused] }
        notes: { type: [string, 'null'], maxLength: 1000 }
    SessionComplete:
      type: object
      properties:
        completedAt: { type: string, format: date-time }
        perceivedDifficulty: { type: integer, minimum: 1, maximum: 5, description: '1 = too easy, 5 = too hard' }
        notes: { type: [string, 'null'], maxLength: 1000 }
    SetLogUpsert:
      type: object
      required: [clientSetId, exerciseId, setIndex, completed]
      properties:
        clientSetId: { type: string, format: uuid, description: Generated on the device; the upsert key }
        exerciseId: { $ref: '#/components/schemas/Id' }
        setIndex: { type: integer, minimum: 0, maximum: 50 }
        reps: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
        weightKg: { type: [number, 'null'], minimum: 0, maximum: 1000 }
        durationSeconds: { type: [integer, 'null'], minimum: 0, maximum: 86400 }
        distanceM: { type: [number, 'null'], minimum: 0, maximum: 1000000 }
        completed: { type: boolean }
        loggedAt: { type: string, format: date-time }
    SetLog:
      allOf:
        - $ref: '#/components/schemas/SetLogUpsert'
        - type: object
          required: [id, updatedAt]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            updatedAt: { type: string, format: date-time }
    WorkoutSession:
      type: object
      required: [id, status, startedAt, sets, activeSeconds]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        planId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        planVersion: { type: [integer, 'null'] }
        plannedWorkoutId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/SessionStatus' }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        activeSeconds: { type: integer, minimum: 0, description: Excludes paused time }
        perceivedDifficulty: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        notes: { type: [string, 'null'] }
        sets: { type: array, items: { $ref: '#/components/schemas/SetLog' } }
    SessionCompleteResult:
      type: object
      required: [session, xpAwarded, xpBalance]
      properties:
        session: { $ref: '#/components/schemas/WorkoutSession' }
        xpAwarded:
          type: integer
          minimum: 0
          description: XP from this completion; the original amount on a replay. A reversed award is never re-awarded.
        xpBalance:
          allOf: [{ $ref: '#/components/schemas/XpBalance' }]
          description: Balance after this completion, including any badge or challenge bonus XP it triggered.
        newBadges:
          type: array
          items: { $ref: '#/components/schemas/Badge' }
          description: |
            Optional, additive. Badges awarded by this completion (earned, `progress` null), in
            catalog order; empty when none. Evaluation is best-effort: if it fails the list is empty
            and the badge still appears on the next `GET /badges`. A replay with the same
            Idempotency-Key returns the stored body unchanged; completing an already-completed
            session with a new key returns `[]`. Clients that ignore this keep polling `GET /badges`.
    SessionCompletionUpdate:
      type: object
      minProperties: 1
      properties:
        completedAt: { type: string, format: date-time, description: 'Same local date (profile timezone) as the current completedAt, no later than it, after startedAt' }
        perceivedDifficulty: { type: integer, minimum: 1, maximum: 5 }
        notes: { type: [string, 'null'], maxLength: 1000 }
    SessionCorrectionResult:
      type: object
      required: [session, xpDelta, xpBalance]
      description: Result of a correction to a completed session (PRD 5.3, `docs/specs/session-correction.md`). Replays return the same body.
      properties:
        session: { $ref: '#/components/schemas/WorkoutSession' }
        xpDelta:
          type: integer
          description: XP change from this correction (negative, zero or positive). The session's net XP never goes below 0.
        xpBalance: { $ref: '#/components/schemas/XpBalance' }
        newBadges:
          type: array
          description: Badges first earned because of this correction, in the same `Badge` shape as `GET /badges`. Optional and additive (badges spec §8); clients must tolerate its absence.
          items: { $ref: '#/components/schemas/Badge' }

    MealType:
      type: string
      enum: [breakfast, lunch, dinner, snack]
    Nutrients:
      type: object
      description: |
        Per one `servingSize` of `servingUnit` on a food; totals on a log entry or a day.
        As input (`FoodCreate.nutrients`, `nutrientsOverride`) each value has at most one
        decimal place and is capped at 5000 kcal, 900 g for each macro and 9000 mg of sodium,
        so 100 servings still fit the diary; larger values are `400 VALIDATION_FAILED`.
      required: [energyKcal, proteinG, carbsG, fatG]
      properties:
        energyKcal: { type: number, minimum: 0 }
        proteinG: { type: number, minimum: 0 }
        carbsG: { type: number, minimum: 0 }
        fatG: { type: number, minimum: 0 }
        fiberG: { type: [number, 'null'], minimum: 0 }
        sugarG: { type: [number, 'null'], minimum: 0 }
        sodiumMg: { type: [number, 'null'], minimum: 0 }
    ServingUnit:
      type: string
      enum: [g, ml, piece, katori, cup, tbsp, tsp, plate, glass, slice]
      description: Indian household measures (katori, plate, glass) alongside metric
    Food:
      type: object
      required: [id, name, servingSize, servingUnit, gramsPerServing, nutrients, source]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        nameHi: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        servingSize: { type: number, exclusiveMinimum: 0 }
        servingUnit: { $ref: '#/components/schemas/ServingUnit' }
        gramsPerServing: { type: [number, 'null'], exclusiveMinimum: 0, description: Weight of one serving when known }
        nutrients: { $ref: '#/components/schemas/Nutrients' }
        isVegetarian: { type: [boolean, 'null'] }
        source: { type: string, enum: [catalog, custom] }
    FoodCreate:
      type: object
      required: [name, servingSize, servingUnit, nutrients]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        brand: { type: [string, 'null'], maxLength: 80, description: Trimmed; a blank brand becomes null }
        servingSize: { type: number, exclusiveMinimum: 0, maximum: 10000, description: At most two decimal places; more is `400 VALIDATION_FAILED` }
        servingUnit: { $ref: '#/components/schemas/ServingUnit' }
        gramsPerServing: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 10000, description: At most two decimal places; more is `400 VALIDATION_FAILED` }
        nutrients: { $ref: '#/components/schemas/Nutrients' }
        isVegetarian: { type: [boolean, 'null'] }
    ExportedFood:
      allOf:
        - $ref: '#/components/schemas/Food'
        - type: object
          required: [deletedAt]
          properties:
            deletedAt: { type: [string, 'null'], format: date-time, description: When the custom food was deleted; null while live }
    FoodUpdate:
      type: object
      minProperties: 1
      description: |
        Partial. A missing field stays unchanged; `brand`, `gramsPerServing` and
        `isVegetarian` may be null to clear them; `nutrients`, when sent, replaces
        all values. An empty body is `400 VALIDATION_FAILED`. `brand` is trimmed and a
        blank brand becomes null.
        Changing `servingUnit` to anything other than `g` requires a weight per serving:
        if the resulting `gramsPerServing` is null, the request is `400 VALIDATION_FAILED`.
        Create (`FoodCreate`) keeps `gramsPerServing` optional for every unit, for
        compatibility with existing clients; the rule applies only when an edit changes
        the unit, so editing other fields of such a food still works.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        brand: { type: [string, 'null'], maxLength: 80, description: Trimmed; a blank brand becomes null }
        servingSize: { type: number, exclusiveMinimum: 0, maximum: 10000, description: At most two decimal places; more is `400 VALIDATION_FAILED` }
        servingUnit: { $ref: '#/components/schemas/ServingUnit' }
        gramsPerServing: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 10000, description: At most two decimal places; more is `400 VALIDATION_FAILED` }
        nutrients: { $ref: '#/components/schemas/Nutrients' }
        isVegetarian: { type: [boolean, 'null'] }
    FoodLog:
      type: object
      required: [id, foodId, foodName, date, mealType, servings, servingSize, servingUnit, gramsPerServing, nutrients, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        foodId: { $ref: '#/components/schemas/Id' }
        foodName: { type: string }
        date: { type: string, format: date }
        mealType: { $ref: '#/components/schemas/MealType' }
        servings: { type: number, exclusiveMinimum: 0 }
        servingSize: { type: number, exclusiveMinimum: 0, description: 'Size of one serving the nutrients were computed from (snapshot at log time; refreshed when servings are recomputed)' }
        servingUnit: { $ref: '#/components/schemas/ServingUnit' }
        gramsPerServing: { type: [number, 'null'], exclusiveMinimum: 0, description: Weight of one serving when known }
        nutrients:
          allOf: [{ $ref: '#/components/schemas/Nutrients' }]
          description: Totals for this entry (servings applied, or the user's edited values)
        nutrientsEdited: { type: boolean, description: True when the user overrode the computed macros }
        createdAt: { type: string, format: date-time }
    FoodLogCreate:
      type: object
      required: [foodId, date, mealType, servings]
      properties:
        foodId: { $ref: '#/components/schemas/Id' }
        date: { type: string, format: date }
        mealType: { $ref: '#/components/schemas/MealType' }
        servings: { type: number, exclusiveMinimum: 0, maximum: 100, description: At most two decimal places; more is `400 VALIDATION_FAILED` }
        nutrientsOverride: { $ref: '#/components/schemas/Nutrients' }
    FoodLogUpdate:
      type: object
      description: |
        Changing `servings` on an entry without user-edited macros recomputes its nutrients
        (and serving snapshot) from the food as it is now, not from the values at log time.
      properties:
        mealType: { $ref: '#/components/schemas/MealType' }
        servings: { type: number, exclusiveMinimum: 0, maximum: 100, description: At most two decimal places; more is `400 VALIDATION_FAILED` }
        nutrientsOverride:
          oneOf: [{ $ref: '#/components/schemas/Nutrients' }, { type: 'null' }]
          description: null restores the computed values
    WaterLog:
      type: object
      required: [id, date, amountMl, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        date: { type: string, format: date }
        amountMl: { type: integer, minimum: 1, maximum: 5000 }
        createdAt: { type: string, format: date-time }
    WaterLogCreate:
      type: object
      required: [date, amountMl]
      properties:
        date: { type: string, format: date }
        amountMl: { type: integer, minimum: 1, maximum: 5000 }
    WaterLogUpdate:
      type: object
      minProperties: 1
      description: Partial. A missing field stays unchanged; neither field can be null. An empty body is `400 VALIDATION_FAILED`.
      properties:
        date: { type: string, format: date }
        amountMl: { type: integer, minimum: 1, maximum: 5000 }
    DailyNutrition:
      type: object
      required: [date, entryCount, entriesMissing, totals, byMeal, waterMl]
      properties:
        date: { type: string, format: date }
        entryCount: { type: integer, minimum: 0, description: Food log entries counted in the totals }
        entriesMissing:
          type: object
          description: |
            Entries with no value for each optional nutrient. `0` means the total is complete.
            Between `0` and `entryCount` the total is partial (it covers only the other entries,
            so it under-counts). Equal to `entryCount` means no data, and the total is `null`.
          required: [fiberG, sugarG, sodiumMg]
          properties:
            fiberG: { type: integer, minimum: 0 }
            sugarG: { type: integer, minimum: 0 }
            sodiumMg: { type: integer, minimum: 0 }
        totals: { $ref: '#/components/schemas/Nutrients' }
        byMeal:
          type: object
          required: [breakfast, lunch, dinner, snack]
          properties:
            breakfast: { $ref: '#/components/schemas/Nutrients' }
            lunch: { $ref: '#/components/schemas/Nutrients' }
            dinner: { $ref: '#/components/schemas/Nutrients' }
            snack: { $ref: '#/components/schemas/Nutrients' }
        waterMl: { type: integer, minimum: 0 }
        calorieTargetKcal: { type: [integer, 'null'] }
        waterTargetMl: { type: [integer, 'null'] }

    NutritionTargets:
      type: object
      description: The profile's current daily targets (targets are not stored historically). A target the user has not set is null.
      required: [kcal, proteinG, carbsG, fatG, waterMl]
      properties:
        kcal: { type: [integer, 'null'], description: '`dailyCalorieTargetKcal`' }
        proteinG: { type: [number, 'null'], description: '`dailyProteinTargetG`; null when unset or 0' }
        carbsG: { type: [number, 'null'], description: '`dailyCarbsTargetG`; null when unset or 0' }
        fatG: { type: [number, 'null'], description: '`dailyFatTargetG`; null when unset or 0' }
        waterMl: { type: [integer, 'null'], description: '`dailyWaterTargetMl`' }
    NutritionAdherence:
      type: object
      description: |
        Percent of the daily target (one decimal, HALF_UP). `kcalPct` and the macro pcts are null when no food was logged in
        the period or their target is null; `waterPct` is null when no water was logged or `targets.waterMl` is null. A target
        of 0 is treated as null.
        `kcalPct` = `avgPerLoggedDay.energyKcal` / `targets.kcal` × 100; `proteinPct`, `carbsPct`, `fatPct` = `avgPerLoggedDay.<macro>` / `targets.<macro>` × 100
        (null until macro targets exist); `waterPct` = `avgWaterMlPerLoggedDay` / `targets.waterMl` × 100.
      required: [kcalPct, proteinPct, carbsPct, fatPct, waterPct]
      properties:
        kcalPct: { type: [number, 'null'], minimum: 0 }
        proteinPct: { type: [number, 'null'], minimum: 0 }
        carbsPct: { type: [number, 'null'], minimum: 0 }
        fatPct: { type: [number, 'null'], minimum: 0 }
        waterPct: { type: [number, 'null'], minimum: 0, description: 'avgWaterMlPerLoggedDay / targets.waterMl × 100' }
    NutritionSummaryPoint:
      type: object
      required: [period, daysInPeriod, daysLogged, totals, avgPerLoggedDay, waterMl, waterDaysLogged, avgWaterMlPerLoggedDay, adherence, entryCount, entriesMissing]
      properties:
        period: { type: string, format: date, description: 'ISO date (YYYY-MM-DD): first date of the period, clipped to `from`' }
        daysInPeriod: { type: integer, minimum: 1, description: Days of the period inside from..to }
        daysLogged: { type: integer, minimum: 0, description: Days in the period with at least one food log }
        totals:
          description: Sum of the period's food logs; null when nothing was logged
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Nutrients'
        avgPerLoggedDay:
          description: '`totals` divided by `daysLogged` (not `daysInPeriod`); null when nothing was logged'
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Nutrients'
        waterMl: { type: [integer, 'null'], minimum: 0, description: 'Period TOTAL water (ml); null when none was logged' }
        waterDaysLogged: { type: integer, minimum: 0, description: Days in the period with at least one water log }
        avgWaterMlPerLoggedDay: { type: [integer, 'null'], minimum: 0, description: '`waterMl` / `waterDaysLogged`, integer HALF_UP; null when no water was logged' }
        adherence:
          description: Null only when every pct would be null (see `NutritionAdherence`)
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/NutritionAdherence'
        entryCount: { type: integer, minimum: 0, description: Food log entries counted in `totals` }
        entriesMissing:
          type: object
          description: As in `DailyNutrition`, over the period's entries
          required: [fiberG, sugarG, sodiumMg]
          properties:
            fiberG: { type: integer, minimum: 0 }
            sugarG: { type: integer, minimum: 0 }
            sodiumMg: { type: integer, minimum: 0 }
    NutritionSummary:
      type: object
      required: [from, to, bucket, timezone, targets, points]
      properties:
        from: { type: string, format: date, description: ISO date (YYYY-MM-DD) as requested }
        to: { type: string, format: date, description: ISO date (YYYY-MM-DD) as requested }
        bucket: { type: string, enum: [day, week, month] }
        timezone: { type: string, description: 'Profile timezone used for local dates (IANA, e.g. Asia/Kolkata)' }
        targets:
          description: Null when the user has set no nutrition or water target
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/NutritionTargets'
        points:
          type: array
          items: { $ref: '#/components/schemas/NutritionSummaryPoint' }

    BodyMeasurement:
      type: object
      required: [id, date, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        date: { type: string, format: date }
        weightKg: { type: [number, 'null'] }
        bodyFatPct: { type: [number, 'null'] }
        waistCm: { type: [number, 'null'] }
        chestCm: { type: [number, 'null'] }
        hipCm: { type: [number, 'null'] }
        armCm: { type: [number, 'null'] }
        thighCm: { type: [number, 'null'] }
        createdAt: { type: string, format: date-time }
    Measurement1dp:
      type: [number, 'null']
      description: Body measurement value. At most 2 decimal places accepted (more is 400); stored and returned rounded half-up to 1 decimal place (e.g. 18.25 → 18.3, 69.96 → 70). `null` = not recorded / clear.
    Measurement2dp:
      type: [number, 'null']
      description: Body measurement value. At most 2 decimal places accepted (more is 400); stored and returned as sent. `null` = not recorded / clear.
    BodyMeasurementCreate:
      type: object
      required: [date]
      minProperties: 2
      description: '`date` plus at least one measurement'
      properties:
        date: { type: string, format: date }
        weightKg: { $ref: '#/components/schemas/Measurement2dp', minimum: 20, maximum: 400 }
        bodyFatPct: { $ref: '#/components/schemas/Measurement1dp', minimum: 2, maximum: 70 }
        waistCm: { $ref: '#/components/schemas/Measurement1dp', minimum: 30, maximum: 250 }
        chestCm: { $ref: '#/components/schemas/Measurement1dp', minimum: 30, maximum: 250 }
        hipCm: { $ref: '#/components/schemas/Measurement1dp', minimum: 30, maximum: 250 }
        armCm: { $ref: '#/components/schemas/Measurement1dp', minimum: 10, maximum: 100 }
        thighCm: { $ref: '#/components/schemas/Measurement1dp', minimum: 20, maximum: 150 }
    BodyMeasurementUpdate:
      type: object
      minProperties: 1
      description: Partial. Missing = unchanged; `null` clears a measurement. `date` cannot be null.
      properties:
        date: { type: string, format: date }
        weightKg: { $ref: '#/components/schemas/Measurement2dp', minimum: 20, maximum: 400 }
        bodyFatPct: { $ref: '#/components/schemas/Measurement1dp', minimum: 2, maximum: 70 }
        waistCm: { $ref: '#/components/schemas/Measurement1dp', minimum: 30, maximum: 250 }
        chestCm: { $ref: '#/components/schemas/Measurement1dp', minimum: 30, maximum: 250 }
        hipCm: { $ref: '#/components/schemas/Measurement1dp', minimum: 30, maximum: 250 }
        armCm: { $ref: '#/components/schemas/Measurement1dp', minimum: 10, maximum: 100 }
        thighCm: { $ref: '#/components/schemas/Measurement1dp', minimum: 20, maximum: 150 }
    ProgressPoint:
      type: object
      required: [date, weightKg, bodyFatPct, waistCm, waterMl, workoutsCompleted, activeMinutes, energyKcal, xpEarned]
      properties:
        date: { type: string, format: date }
        weightKg: { type: [number, 'null'], description: null = not measured that day }
        bodyFatPct: { type: [number, 'null'], description: null = not measured that day }
        waistCm: { type: [number, 'null'], description: null = not measured that day }
        waterMl: { type: [integer, 'null'], minimum: 0, description: Total water logged that day; null = nothing logged }
        workoutsCompleted: { type: integer, minimum: 0 }
        activeMinutes: { type: integer, minimum: 0 }
        energyKcal: { type: [number, 'null'], description: null = nothing logged that day }
        xpEarned: { type: integer, minimum: 0 }
    PersonalRecords:
      type: object
      description: |
        All-time bests over every counting set (not limited to `from`/`to`), so a record never disappears
        when the range changes. `null` = no qualifying set, never 0. Each `…AchievedAt` is the `completedAt`
        of the session that first reached the value (earliest wins a tie) and is null exactly when its value is.
        Weights in kg (stored unit; clients convert for `unitSystem: imperial`).
      required: [maxWeightKg, maxWeightKgAchievedAt, maxReps, maxRepsAchievedAt, best1RmKg, best1RmKgAchievedAt]
      properties:
        maxWeightKg: { type: [number, 'null'], minimum: 0, description: Heaviest `weightKg` > 0 in a set with reps ≥ 1 }
        maxWeightKgAchievedAt: { type: [string, 'null'], format: date-time }
        maxReps: { type: [integer, 'null'], minimum: 1, description: Most `reps` in one set (weighted or bodyweight) }
        maxRepsAchievedAt: { type: [string, 'null'], format: date-time }
        best1RmKg:
          type: [number, 'null']
          minimum: 0
          description: 'Epley estimate `weightKg × (1 + reps / 30)`, only for sets with `weightKg` > 0 and 1 ≤ `reps` ≤ 12; a 1-rep set counts as its weight. One decimal, HALF_UP.'
        best1RmKgAchievedAt: { type: [string, 'null'], format: date-time }
    ExerciseProgressSummary:
      type: object
      required: [exerciseId, name, trackingType, sessions, lastPerformedAt, pr]
      properties:
        exerciseId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        trackingType: { $ref: '#/components/schemas/TrackingType' }
        sessions: { type: integer, minimum: 1, description: Completed sessions in the range with at least one counting set of this exercise }
        lastPerformedAt: { type: string, format: date-time, description: Latest such session's `completedAt` in the range }
        pr: { $ref: '#/components/schemas/PersonalRecords' }
    ExerciseProgress:
      type: object
      required: [exerciseId, name, trackingType, from, to, bucket, timezone, pr, points]
      properties:
        exerciseId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        trackingType: { $ref: '#/components/schemas/TrackingType' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        bucket: { type: string, enum: [day, week, month] }
        timezone: { type: string }
        pr: { $ref: '#/components/schemas/PersonalRecords' }
        points: { type: array, items: { $ref: '#/components/schemas/ExerciseProgressPoint' } }
    ExerciseProgressPoint:
      type: object
      required: [period, sessions, sets, volumeKg, totalReps, topSetWeightKg, best1RmKg]
      properties:
        period: { type: string, format: date, description: First date of the (clipped) period }
        sessions: { type: integer, minimum: 0 }
        sets: { type: integer, minimum: 0, description: Counting sets of this exercise }
        volumeKg: { type: [number, 'null'], minimum: 0, description: 'Σ `weightKg × reps` over sets with both > 0 (two decimals). Null when the period has no weighted set (bodyweight, duration).' }
        totalReps: { type: [integer, 'null'], minimum: 0, description: Σ `reps` over sets that have reps (weighted and bodyweight). Null when none do. }
        topSetWeightKg: { type: [number, 'null'], minimum: 0, description: Heaviest `weightKg` > 0 with reps ≥ 1 in the period }
        best1RmKg: { type: [number, 'null'], minimum: 0, description: Best Epley estimate in the period (same rule as `PersonalRecords.best1RmKg`) }

    ProgressSummary:
      type: object
      required: [from, to, points, streakDays]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        points:
          type: array
          description: Exactly one point for every day from `from` to `to` inclusive, in date order. Days without data are present with `null` metrics and 0 counts, never skipped.
          items: { $ref: '#/components/schemas/ProgressPoint' }
        streakDays:
          type: integer
          minimum: 0
          description: Consecutive local days (profile timezone) with a completed workout, ending today. If today has none yet, the streak ending yesterday is returned, because it is still alive until today ends.

    BadgeFamily:
      type: string
      enum: [workout, streak, nutrition, hydration, measurement, level]
      description: Clients must accept unknown values.
    Badge:
      type: object
      required: [code, title, description, family, bonusXp, earnedAt, progress]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,40}$', description: 'Stable id, e.g. `FIRST_WORKOUT`, `STREAK_7`, `HYDRATED_7`. New codes can appear; clients must not hard-code the list.' }
        title: { type: string }
        description: { type: string, description: The exact rule in plain words }
        family: { $ref: '#/components/schemas/BadgeFamily' }
        bonusXp: { type: integer, minimum: 0 }
        earnedAt: { type: [string, 'null'], format: date-time, description: null = not earned yet }
        progress:
          description: Progress towards the rule; null once earned or when the rule has no meaningful count
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/BadgeProgress'
    BadgeProgress:
      type: object
      required: [current, target]
      properties:
        current: { type: integer, minimum: 0 }
        target: { type: integer, minimum: 1 }
    BadgeList:
      type: object
      required: [items, earnedCount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Badge' } }
        earnedCount: { type: integer, minimum: 0 }
    ExportedBadge:
      type: object
      required: [code, earnedAt]
      properties:
        code: { type: string }
        earnedAt: { type: string, format: date-time }
    ChallengeType:
      type: string
      enum: [weekly, personal]
    ChallengeStatus:
      type: string
      enum: [active, completed, expired, left]
    ChallengeTemplate:
      type: object
      required: [code, type, title, description, metric, unit, targets, deadlineDays, bonusXp]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,40}$', description: 'e.g. `WEEKLY_WORKOUTS`, `WEEKLY_ACTIVE_MINUTES`, `WEEKLY_WATER_DAYS`, `WEEKLY_FOOD_LOG_DAYS`, `PERSONAL_WORKOUTS_N`, `PERSONAL_STREAK_N`' }
        type: { $ref: '#/components/schemas/ChallengeType' }
        title: { type: string }
        description: { type: string }
        metric: { type: string, description: 'What is counted, e.g. `completed_workouts`, `active_minutes`, `water_goal_days`, `food_log_days`, `streak_days`' }
        unit: { type: string, description: 'Display unit for progress, e.g. `workouts`, `minutes`, `days`' }
        targets: { type: array, minItems: 1, items: { type: integer, minimum: 1 }, description: 'Allowed `target` values' }
        deadlineDays: { type: [array, 'null'], items: { type: integer, minimum: 1 }, description: 'Personal only: window length in days for each entry of `targets` (same order and length); null for weekly' }
        bonusXp: { type: integer, minimum: 0, description: Before the weekly cap }
    ChallengeJoinRequest:
      type: object
      additionalProperties: false
      required: [templateCode, target]
      properties:
        templateCode: { type: string, maxLength: 40 }
        target: { type: integer, minimum: 1, description: 'Must be one of the template''s `targets`' }
    Challenge:
      type: object
      required: [id, templateCode, type, title, target, progress, unit, windowStart, windowEnd, joinDate, timezone, waterGoalMl, status, joinedAt, completedAt, leftAt, xpAwarded]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        templateCode: { type: string }
        type: { $ref: '#/components/schemas/ChallengeType' }
        title: { type: string }
        target: { type: integer, minimum: 1 }
        progress: { type: integer, minimum: 0, description: 'min(current, target), recomputed from source data while active; frozen once completed, expired or left' }
        unit: { type: string }
        windowStart: { type: string, format: date, description: 'Local date, inclusive' }
        windowEnd: { type: [string, 'null'], format: date, description: 'Local date, inclusive (Sunday for weekly); null = no deadline' }
        joinDate: { type: string, format: date, description: 'Local date of joining (in `timezone`). Streak challenges count only days on or after it; personal workout challenges count workouts finished after `joinedAt`.' }
        timezone: { type: string, description: Profile timezone captured at join }
        waterGoalMl: { type: [integer, 'null'], description: Water goal captured at join (water templates only) }
        status: { $ref: '#/components/schemas/ChallengeStatus' }
        joinedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time, description: Never cleared once set }
        leftAt: { type: [string, 'null'], format: date-time }
        xpAwarded: { type: integer, minimum: 0, description: Bonus XP actually awarded (after the weekly cap); 0 until completed }
    XpSourceType:
      type: string
      enum: [workout_session, adjustment, badge, challenge, session_correction]
      description: '`adjustment` is a server-side reversal or correction, never a client write. `badge` and `challenge` are bonus XP (`sourceId` = the earned badge or the challenge id); challenge bonus XP is capped at 150 per ISO week (Monday start, profile timezone), so an award can be smaller than the template''s `bonusXp`, or 0. `session_correction` is a server-side XP change from correcting or discarding a completed session (positive or negative); its `sourceId` is a `session_corrections` row id, not the session or award id (see docs/specs/session-correction.md). Clients must accept unknown values.'
    XpTransaction:
      type: object
      required: [id, sourceType, sourceId, amount, reason, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sourceType: { $ref: '#/components/schemas/XpSourceType' }
        sourceId:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          description: 'Depends on `sourceType`: the session for `workout_session`, the reversed entry for `adjustment`, the user badge or challenge for `badge`/`challenge`, and a `session_corrections` row id for `session_correction`.'
        amount: { type: integer, description: Negative for reversals }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    XpBalance:
      type: object
      required: [total, level, xpIntoLevel, xpForNextLevel]
      properties:
        total: { type: integer, minimum: 0 }
        level: { type: integer, minimum: 1 }
        xpIntoLevel: { type: integer, minimum: 0 }
        xpForNextLevel: { type: integer, minimum: 1 }
