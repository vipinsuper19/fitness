openapi: 3.1.0
info:
  title: Fitness API
  version: 1.0.0
  summary: Lean MVP API for the Fitness Android app (India first).
  description: |
    Source of truth for `/api/v1`. The backend's generated Swagger is checked
    against this file and the Android client is built from it.

    **Conventions**
    - **Auth:** email and password. The server issues its own JWTs: a
      15-minute access token (`Authorization: Bearer`) and a rotating refresh
      token. A refresh token is single-use; reusing one revokes its family.
    - **Units:** canonical metric (kg, cm, ml, kcal, grams of macros). The
      client converts for display. Money, when it appears, is INR in paise
      (integer) with `currency: INR`.
    - **Dates:** `date` is a local calendar date (YYYY-MM-DD) in the user's
      timezone (default `Asia/Kolkata`); `date-time` is RFC 3339 with offset.
    - **Missing vs zero:** a `null` metric means "no data", never 0.
    - **Errors:** every non-2xx body is `Error`; `requestId` matches the
      `X-Request-Id` response header.
    - **Idempotency:** every write (POST, PUT, PATCH, DELETE) accepts an
      `Idempotency-Key` header (a client UUID). It is **required** on
      endpoints that can award XP or create rows the client retries offline.
      A replay with the same key and body returns the stored response with
      `Idempotent-Replayed: true`. The same key with a different body is
      `409 IDEMPOTENCY_KEY_REUSED`; a replay while the first request is still
      running is `409 IDEMPOTENCY_IN_PROGRESS`. Keys are kept for 24 hours and
      are scoped to the user.
      - A key is bound to the method, path and body hash of its first request.
        Reusing it on a **different method or path** is
        `409 IDEMPOTENCY_KEY_REUSED`; it is never replayed against another
        endpoint.
      - **Token-bearing responses are never stored.** `/auth/login` and
        `/auth/refresh` do not use idempotency keys, and `/auth/register` uses
        its key only to reject a concurrent duplicate
        (`409 IDEMPOTENCY_IN_PROGRESS`). A register replay after the first
        request finished re-runs the request: it returns `409 EMAIL_TAKEN` if
        the account was created (sign in instead), or fresh tokens if it was
        not. Tokens are never replayed from storage.
      - Rows tied to an account are erased with the account.
    - **XP:** awarded only by the server (workout completion in the MVP).
      There is no client endpoint that writes XP. The ledger is unique per
      `(userId, sourceType, sourceId)`, so retries never double-award.
      A reversal is a negative `adjustment` entry whose `sourceId` is the
      reversed entry. A reversed award is **never re-awarded**: the original
      entry stays in the ledger, so completing, replaying or re-completing
      the same session awards nothing, and an entry can be reversed only once.
      Session corrections and discards (PRD 5.3) are `session_correction`
      entries whose `sourceId` is a `session_corrections` row id, one per
      correction, so a session can be corrected many times.
    - **Ownership:** every user-owned resource is checked; another user's
      id returns `404 NOT_FOUND`, never 403, so ids are not enumerable.
    - **AI:** there is no AI provider in the MVP. "Generate" endpoints use
      deterministic rule-based fallbacks and say so in `generator`.
    - **Pagination:** cursor based: `?cursor&limit` → `{ items, nextCursor }`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://fitness-api-6pcc.onrender.com/api/v1
    description: Render (production)
  - url: http://localhost:3000/api/v1
    description: Local
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Email and password sign-in with self-issued JWTs
  - name: me
    description: Account, profile, export and deletion
  - name: goals
    description: Fitness goals
  - name: exercises
    description: Seeded, read-only exercise catalog
  - name: workout-plans
    description: Rule-based or custom plans, versioned
  - name: workout-sessions
    description: Workout tracking, set logs and completion (awards XP)
  - name: nutrition
    description: Foods, food logs, water and daily totals
  - name: progress
    description: Body measurements and progress summary
  - name: xp
    description: Server-authoritative XP ledger (read-only)
  - name: badges
    description: Rule-based achievements, awarded server-side only (read-only for clients). See docs/specs/badges-challenges.md
  - name: challenges
    description: Personal and weekly challenges from built-in templates (join, leave, progress). No leaderboards or social

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account with email and password
      description: |
        `Idempotency-Key` only rejects a concurrent duplicate
        (`409 IDEMPOTENCY_IN_PROGRESS`). The response holds tokens, so it is
        never stored or replayed. Retrying after the first request finished
        returns `409 EMAIL_TAKEN` when the account exists (sign in instead),
        or `201` with fresh tokens when the first attempt did not create it.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: '`EMAIL_TAKEN` (also on a retry after a successful sign-up), `IDEMPOTENCY_IN_PROGRESS`, or `IDEMPOTENCY_KEY_REUSED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: Takes no `Idempotency-Key`; token responses are never stored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`INVALID_CREDENTIALS` (same response for unknown email and wrong password)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Rotate the refresh token and get a new access token
      description: The presented refresh token is revoked. Reusing a revoked token revokes the whole family (`REFRESH_TOKEN_REUSED`). Takes no `Idempotency-Key`; token responses are never stored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: '`REFRESH_TOKEN_INVALID`, `REFRESH_TOKEN_EXPIRED` or `REFRESH_TOKEN_REUSED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke a refresh token (this device)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Signed out (also returned for an already revoked token) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    delete:
      tags: [me]
      operationId: deleteAccount
      summary: Delete the account and all user data
      description: |
        Requires the current password. Revokes every token; data is erased, not soft-deleted.
        A body without `password` (e.g. `{}`) is `400 VALIDATION_FAILED` with `details.fields.password` = `password is required`.
        Retrying after a successful delete (same or new Idempotency-Key) returns `401`: the access token's user no longer exists.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`UNAUTHORIZED`, including any retry after a successful delete'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`INVALID_PASSWORD`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/export:
    get:
      tags: [me]
      operationId: exportMyData
      summary: Export all of the user's data as JSON
      description: >-
        Only the signed-in user's own data; never password hashes, refresh tokens or idempotency records.
        `workoutPlans` has one entry per plan version (same `id`, different `version`), newest first.
        Bounded and newest-first (defaults, configurable server-side): 5000 rows per top-level collection,
        2000 sessions, 200 plan versions, 20000 set logs in total across the exported sessions and 10000
        planned exercises in total across the exported plan versions. Anything cut is named in `truncated`
        (`workoutSessions.sets` and `workoutPlans.exercises` for the nested caps). `profile` is omitted
        when the user has not created one yet. Rate-limited per user (default 5 per hour,
        `429 RATE_LIMITED` with `Retry-After`). Sent with `Cache-Control: no-store`.
      responses:
        '200':
          description: Full export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/profile:
    get:
      tags: [me]
      operationId: getProfile
      summary: Get the profile
      responses:
        '200':
          description: Profile (fields are null until onboarding sets them)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [me]
      operationId: updateProfile
      summary: Replace the profile (onboarding and edit)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /goals:
    get:
      tags: [goals]
      operationId: listGoals
      summary: List goals
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/GoalStatus' }
      responses:
        '200':
          description: Goals, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Goal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [goals]
      operationId: createGoal
      summary: Create a goal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /goals/{goalId}:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      tags: [goals]
      operationId: getGoal
      summary: Get a goal
      responses:
        '200':
          description: Goal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [goals]
      operationId: updateGoal
      summary: Update a goal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
    delete:
      tags: [goals]
      operationId: deleteGoal
      summary: Delete a goal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exercises:
    get:
      tags: [exercises]
      operationId: listExercises
      summary: Search the seeded, read-only exercise catalog
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
        - name: muscle
          in: query
          schema: { $ref: '#/components/schemas/MuscleGroup' }
        - name: equipment
          in: query
          schema: { $ref: '#/components/schemas/Equipment' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of exercises
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Exercise' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /exercises/{exerciseId}:
    get:
      tags: [exercises]
      operationId: getExercise
      summary: Get an exercise
      parameters:
        - $ref: '#/components/parameters/ExerciseId'
      responses:
        '200':
          description: Exercise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercise' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workout-plans/generate:
    post:
      tags: [workout-plans]
      operationId: generateWorkoutPlan
      summary: Build a draft plan (rule-based in the MVP; never persisted)
      description: Pure function of the request and the catalog. Same input gives the same draft. Save it with `POST /workout-plans`. A successful draft always has at least one workout; otherwise `422 NO_MATCHING_EXERCISES` or `503 EXERCISE_CATALOG_EMPTY`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanGenerateRequest' }
      responses:
        '200':
          description: Draft plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlanDraft' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422':
          description: '`NO_MATCHING_EXERCISES`: the catalog has exercises but none fit this `experienceLevel` and `equipment` (bodyweight is always allowed). `details` echoes `experienceLevel` and `equipment`. The user can change their inputs, e.g. add equipment.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: '`EXERCISE_CATALOG_EMPTY`: the server has no exercise catalog (not seeded). A server-side problem the user cannot fix; show a "try again later" state. The response `message` is the generic 5xx text. Never an empty draft.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workout-plans:
    get:
      tags: [workout-plans]
      operationId: listWorkoutPlans
      summary: List the user's saved plans (plan management)
      description: |
        Summaries only (no workouts); open one with `GET /workout-plans/{planId}`.
        Newest `createdAt` first, ties by `id`. Without `status`, returns active, paused and
        inactive plans (archived plans are hidden unless asked for).
        **Regenerating** a plan is not a separate call: `POST /workout-plans/generate`
        (draft), then `POST /workout-plans` (save as a new plan), then
        `POST /workout-plans/{planId}/activate`. The old plan becomes inactive and can be
        archived with `DELETE /workout-plans/{planId}`.
      parameters:
        - name: status
          in: query
          description: '`active` (at most one), `paused`, `inactive` (saved, not active/paused/archived) or `archived`. Omit for everything except archived.'
          schema: { $ref: '#/components/schemas/PlanStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of plan summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WorkoutPlanSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [workout-plans]
      operationId: createWorkoutPlan
      summary: Save a plan (from a draft or custom) as version 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutPlanDraft' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /workout-plans/active:
    get:
      tags: [workout-plans]
      operationId: getActiveWorkoutPlan
      summary: Get the active plan
      responses:
        '200':
          description: The active plan (latest version)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlan' }
        '204': { description: No active plan }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workout-plans/{planId}:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [workout-plans]
      operationId: getWorkoutPlan
      summary: Get a plan version
      parameters:
        - name: version
          in: query
          description: A specific version; latest when omitted
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [workout-plans]
      operationId: updateWorkoutPlan
      summary: Edit a plan by creating a new version
      description: Earlier versions stay readable, so logged sessions keep pointing at the version they followed. `baseVersion` must be the latest version or the call fails with `409 VERSION_CONFLICT`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutPlanUpdate' }
      responses:
        '200':
          description: New version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`VERSION_CONFLICT`, `PLAN_ARCHIVED` (archived plans are read-only), or an idempotency conflict'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [workout-plans]
      operationId: archiveWorkoutPlan
      summary: Archive a plan (soft delete; sessions and XP are kept)
      description: |
        Sets the plan's `archivedAt`; nothing is hard-deleted. Logged sessions keep their
        `plannedWorkoutId`/`planVersion`, history and the XP ledger are unchanged, and
        every version stays readable with `GET /workout-plans/{planId}` (now with
        `archivedAt` set). Archiving the active plan deactivates it first (same effect as
        `POST /workout-plans/{planId}/deactivate`). Repeating it is a no-op that returns
        204 and keeps the original `archivedAt`. An archived plan is read-only:
        `PATCH` and `activate` return `409 PLAN_ARCHIVED`. Sessions already started from it
        can still be logged and completed (offline sync).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Archived (or already archived) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /workout-plans/{planId}/deactivate:
    post:
      tags: [workout-plans]
      operationId: deactivateWorkoutPlan
      summary: Pause a plan (the user then has no active plan)
      description: |
        If this is the active plan: clears the user's active plan and sets the plan's
        `pausedAt` to now (`status: paused`). Idempotent: a plan that is not active
        (inactive, already paused, or archived) returns 204 and nothing changes; an
        existing `pausedAt` is kept, and an archived plan never gains one.
        Afterwards `GET /workout-plans/active` returns 204, and this plan reports
        `isActive: false` with `currentWeek` and `planEnded` null (they are only computed
        for the active plan). `activatedAt` keeps its value.
        Resume with `POST .../activate` and `{ "resume": true }` to continue the same
        week; without it, activation restarts at week 1.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Not active (now or already) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /workout-plans/{planId}/activate:
    post:
      tags: [workout-plans]
      operationId: activateWorkoutPlan
      summary: Make this plan the active one (deactivates the previous)
      description: |
        Default (no body, or `resume: false`): `activatedAt` = now, so `currentWeek`
        restarts at 1 (unchanged behaviour), and `pausedAt` is cleared.
        `resume: true` on a paused plan: `activatedAt` moves forward by the paused time
        (`now − pausedAt`) and `pausedAt` is cleared, so `currentWeek` continues where
        it stopped (weeks are then counted from the shifted date in local calendar
        days, as usual). The shift is always the full pause, even if other plans were
        active in between. `resume: true` on a plan that was never paused (or has no
        `activatedAt`) activates normally. Resuming a plan that had already ended gives
        `currentWeek = weeks` and `planEnded: true` (the usual cap); a default activate
        starts it over at week 1. Activating the plan that is already active
        changes nothing, with or without `resume`.
        The previously active plan becomes `inactive` (not paused).
        Servers before this change ignore the body, so `resume` there restarts at week 1.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanActivate' }
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`PLAN_ARCHIVED`: archived plans cannot be activated; save a new plan instead. Or an idempotency conflict.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /workout-sessions:
    post:
      tags: [workout-sessions]
      operationId: startWorkoutSession
      summary: Start a session (optionally from a planned workout)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionStart' }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /workout-sessions/history:
    get:
      tags: [workout-sessions]
      operationId: listWorkoutHistory
      summary: List completed sessions
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Completed sessions, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WorkoutSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workout-sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [workout-sessions]
      operationId: getWorkoutSession
      summary: Get a session with its sets
      responses:
        '200':
          description: Session with its sets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [workout-sessions]
      operationId: updateWorkoutSession
      summary: Pause or resume a session, or edit notes
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SESSION_COMPLETED` (completed sessions are read-only), or an idempotency conflict'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [workout-sessions]
      operationId: discardWorkoutSession
      summary: Discard a session logged by mistake (reverses its XP)
      description: |
        Deletes the session and its sets. If the session awarded XP, the
        server writes one negative `adjustment` whose `sourceId` is the award.
        The award stays in the ledger, so the session can never be awarded
        again. The client never writes XP.

        This is also the way to discard a **completed** session (PRD 5.3,
        `docs/specs/session-correction.md`). Once session correction ships, a
        discard writes its own ledger row (`source_type` `session_correction`,
        `source_id` = a new `session_corrections` row of kind `discard`) whose
        amount is minus the session's current net XP (award plus earlier
        correction deltas), so the net becomes 0 and a discard after corrections
        never hits the ledger's unique key. Legacy discard rows (`adjustment`
        with `sourceId` = the award id) stay valid and still count. A correction that would remove the last completed set
        returns `422 SESSION_EMPTY`, which points the client here. Earned badges
        and completed challenges are never revoked; active challenge progress is
        recomputed. The response stays `204` with no body (unchanged for released
        clients). Discard is not limited by the correction window.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '204': { description: Discarded }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /workout-sessions/{sessionId}/sets:
    post:
      tags: [workout-sessions]
      operationId: upsertSetLog
      summary: Log or correct a set (upsert by the client's set UUID)
      description: |
        The client-generated `clientSetId` makes this safe to retry from offline sync. Sending the same `clientSetId` again replaces that set.
        Unchanged by session correction: on a completed session this returns `409 SESSION_COMPLETED`; use `PUT /workout-sessions/{sessionId}/corrections/sets/{clientSetId}` instead.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLogUpsert' }
      responses:
        '200':
          description: Set stored (created or replaced)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SESSION_COMPLETED`, `CLIENT_SET_CONFLICT` (the `clientSetId` belongs to a set in another session), or an idempotency conflict'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workout-sessions/{sessionId}/complete:
    post:
      tags: [workout-sessions]
      operationId: completeWorkoutSession
      summary: Finish a session; the only call that awards workout XP
      description: |
        XP is computed and written by the server in the same transaction.
        A retry (same key) or a second completion returns the original result
        and never awards XP twice.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionComplete' }
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionCompleteResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: '`SESSION_EMPTY` (no completed sets)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workout-sessions/{sessionId}/corrections/sets/{clientSetId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/ClientSetId'
    put:
      tags: [workout-sessions]
      operationId: correctSetLog
      summary: Correct a set on a completed session (upsert by clientSetId)
      description: |
        Upserts by `clientSetId`: if the session already has a set with this `clientSetId` it is edited in place;
        otherwise one set is added. It never creates a duplicate. The body's `clientSetId` must equal the path value (`400` otherwise).
        A `clientSetId` that belongs to a set in another session returns `409 CLIENT_SET_CONFLICT`.
        Unchecking or editing so that no completed set is left returns `422 SESSION_EMPTY` (discard with `DELETE /workout-sessions/{sessionId}` instead).
        Completed sessions only (`409 SESSION_NOT_COMPLETED` otherwise), and only while the session's
        `completedAt` local date (profile timezone) is today or yesterday (`409 CORRECTION_WINDOW_CLOSED` otherwise).
        The server recomputes the session's workout XP and writes the difference as one new append-only ledger row
        (`source_type` `session_correction`, `source_id` = a new `session_corrections` row id), so repeated corrections never
        collide on the ledger's unique key. Net session XP = award + sum of deltas, never below 0, recomputes active challenge progress and re-evaluates badges.
        Earned badges and completed challenges are never revoked. A retry with the same Idempotency-Key replays the same body.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLogUpsert' }
      responses:
        '200':
          description: Corrected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionCorrectionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SESSION_NOT_COMPLETED`, `CORRECTION_WINDOW_CLOSED`, `CLIENT_SET_CONFLICT`, or an idempotency conflict'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`SESSION_EMPTY`: no completed set would be left; discard the session instead'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [workout-sessions]
      operationId: deleteCorrectedSetLog
      summary: Delete a set from a completed session
      description: |
        Deleting the last completed set returns `422 SESSION_EMPTY` (discard with `DELETE /workout-sessions/{sessionId}` instead).
        A retry with the same key replays the original `200` body. A delete repeated with a new key, or for an unknown
        `clientSetId`, returns `404 SET_NOT_FOUND`, so an offline outbox can drop it. An unknown session stays `404 NOT_FOUND`.
        Completed sessions only (`409 SESSION_NOT_COMPLETED` otherwise), and only while the session's
        `completedAt` local date (profile timezone) is today or yesterday (`409 CORRECTION_WINDOW_CLOSED` otherwise).
        The server recomputes the session's workout XP and writes the difference as one new append-only ledger row
        (`source_type` `session_correction`, `source_id` = a new `session_corrections` row id), so repeated corrections never
        collide on the ledger's unique key. Net session XP = award + sum of deltas, never below 0, recomputes active challenge progress and re-evaluates badges.
        Earned badges and completed challenges are never revoked. A retry with the same Idempotency-Key replays the same body.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: Corrected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionCorrectionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`SET_NOT_FOUND` (no such set in this session, e.g. already deleted), or `NOT_FOUND` for the session'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`SESSION_NOT_COMPLETED`, `CORRECTION_WINDOW_CLOSED`, or an idempotency conflict'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`SESSION_EMPTY`: this is the last completed set; discard the session instead'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workout-sessions/{sessionId}/completion:
    patch:
      tags: [workout-sessions]
      operationId: correctSessionCompletion
      summary: Fix a completed session's details
      description: |
        A new `completedAt` must be on the same local date (profile timezone) as the current `completedAt`, no later than it,
        and after `startedAt` (`400 VALIDATION_FAILED` otherwise), so a correction can never move a workout into another day,
        week or challenge window.
        Changing `completedAt` can change active time and so XP.
        Completed sessions only (`409 SESSION_NOT_COMPLETED` otherwise), and only while the session's
        `completedAt` local date (profile timezone) is today or yesterday (`409 CORRECTION_WINDOW_CLOSED` otherwise).
        The server recomputes the session's workout XP and writes the difference as one new append-only ledger row
        (`source_type` `session_correction`, `source_id` = a new `session_corrections` row id), so repeated corrections never
        collide on the ledger's unique key. Net session XP = award + sum of deltas, never below 0, recomputes active challenge progress and re-evaluates badges.
        Earned badges and completed challenges are never revoked. A retry with the same Idempotency-Key replays the same body.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCompletionUpdate' }
      responses:
        '200':
          description: Corrected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionCorrectionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SESSION_NOT_COMPLETED`, `CORRECTION_WINDOW_CLOSED`, or an idempotency conflict'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

