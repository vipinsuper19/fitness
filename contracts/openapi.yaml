      parameters:
        - $ref: '#/components/parameters/DateRequired'
      responses:
        '200':
          description: Entries for the day
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WaterLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [nutrition]
      operationId: createWaterLog
      summary: Log water
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaterLogCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaterLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /water-logs/{waterLogId}:
    parameters:
      - $ref: '#/components/parameters/WaterLogId'
    patch:
      tags: [nutrition]
      operationId: updateWaterLog
      summary: Edit a water entry
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaterLogCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaterLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
    delete:
      tags: [nutrition]
      operationId: deleteWaterLog
      summary: Delete a water entry
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /nutrition/daily:
    get:
      tags: [nutrition]
      operationId: getDailyNutrition
      summary: Daily nutrition totals
      parameters:
        - $ref: '#/components/parameters/DateRequired'
      responses:
        '200':
          description: Totals for the day against the user's targets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyNutrition' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /body-measurements:
    get:
      tags: [progress]
      operationId: listBodyMeasurements
      summary: List body measurements
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Measurements, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/BodyMeasurement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [progress]
      operationId: createBodyMeasurement
      summary: Add a body measurement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BodyMeasurementCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BodyMeasurement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /body-measurements/{measurementId}:
    parameters:
      - $ref: '#/components/parameters/MeasurementId'
    get:
      tags: [progress]
      operationId: getBodyMeasurement
      summary: Get a body measurement
      responses:
        '200':
          description: Measurement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BodyMeasurement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [progress]
      operationId: updateBodyMeasurement
      summary: Edit a body measurement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BodyMeasurementCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BodyMeasurement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
    delete:
      tags: [progress]
      operationId: deleteBodyMeasurement
      summary: Delete a body measurement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /progress/summary:
    get:
      tags: [progress]
      operationId: getProgressSummary
      summary: Progress over a date range
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: One point per day; `null` means no data that day, never 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /xp/balance:
    get:
      tags: [xp]
      operationId: getXpBalance
      summary: XP balance and level
      responses:
        '200':
          description: Server-computed balance and level
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XpBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /xp/ledger:
    get:
      tags: [xp]
      operationId: listXpLedger
      summary: XP ledger (read-only)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ledger entries, newest first (read-only)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/XpTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /auth/login, /auth/register or /auth/refresh (15 minutes).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client UUID that makes a retry safe. See the conventions above.
      schema: { type: string, format: uuid }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Required here because the client retries this write from offline sync, or it can award XP.
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    DateRequired:
      name: date
      in: query
      required: true
      description: Local date in the user's timezone
      schema: { type: string, format: date }
    GoalId:
      name: goalId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ExerciseId:
      name: exerciseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    FoodLogId:
      name: foodLogId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    WaterLogId:
      name: waterLogId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    MeasurementId:
      name: measurementId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }

  headers:
    RetryAfter:
      description: Seconds to wait before retrying
      schema: { type: integer, minimum: 1 }

  responses:
    ValidationError:
      description: '`VALIDATION_FAILED`; `details.fields` maps field paths to messages'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '`UNAUTHENTICATED` (missing or bad token) or `TOKEN_EXPIRED` (refresh and retry)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`NOT_FOUND`, including another user''s resource'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdempotencyConflict:
      description: '`IDEMPOTENCY_KEY_REUSED` (different body, method or path; never replayed) or `IDEMPOTENCY_IN_PROGRESS`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: '`RATE_LIMITED`'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Id:
      type: string
      format: uuid
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: Stable machine code (UPPER_SNAKE_CASE). Clients branch on this, not on `message`.
          examples: [VALIDATION_FAILED, NOT_FOUND, IDEMPOTENCY_KEY_REUSED]
        message:
          type: string
          description: Human-readable, safe to show
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; null on the last page

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Hashed with argon2id; never stored or logged in clear
        displayName: { type: string, minLength: 1, maxLength: 60 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 512 }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn:
          type: integer
          description: Access token lifetime in seconds (900)
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        displayName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }

    Sex:
      type: string
      enum: [male, female, other, prefer_not_to_say]
    ActivityLevel:
      type: string
      enum: [sedentary, light, moderate, active, very_active]
    ExperienceLevel:
      type: string
      enum: [beginner, intermediate, advanced]
    UnitSystem:
      type: string
      enum: [metric, imperial]
      description: Display preference only; the API always uses metric
    DietPreference:
      type: string
      enum: [vegetarian, eggetarian, non_vegetarian, vegan, jain]
    Profile:
      type: object
      required: [userId, unitSystem, timezone, locale, currency, onboardingCompleted, updatedAt]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        displayName: { type: [string, 'null'], maxLength: 60 }
        birthYear: { type: [integer, 'null'], minimum: 1900, maximum: 2100 }
        sex: { oneOf: [{ $ref: '#/components/schemas/Sex' }, { type: 'null' }] }
        heightCm: { type: [number, 'null'], minimum: 50, maximum: 272 }
        weightKg: { type: [number, 'null'], minimum: 20, maximum: 400 }
        activityLevel: { oneOf: [{ $ref: '#/components/schemas/ActivityLevel' }, { type: 'null' }] }
        experienceLevel: { oneOf: [{ $ref: '#/components/schemas/ExperienceLevel' }, { type: 'null' }] }
        dietPreference: { oneOf: [{ $ref: '#/components/schemas/DietPreference' }, { type: 'null' }] }
        unitSystem: { $ref: '#/components/schemas/UnitSystem' }
        timezone: { type: string, default: Asia/Kolkata, description: IANA timezone }
        locale: { type: string, default: en-IN }
        currency: { type: string, const: INR }
        dailyCalorieTargetKcal: { type: [integer, 'null'], minimum: 800, maximum: 6000 }
        dailyWaterTargetMl: { type: [integer, 'null'], minimum: 250, maximum: 10000 }
        onboardingCompleted: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      description: Every field is optional so onboarding can be skipped and resumed. A null clears the value.
      properties:
        displayName: { type: [string, 'null'], maxLength: 60 }
        birthYear: { type: [integer, 'null'], minimum: 1900, maximum: 2100 }
        sex: { oneOf: [{ $ref: '#/components/schemas/Sex' }, { type: 'null' }] }
        heightCm: { type: [number, 'null'], minimum: 50, maximum: 272 }
        weightKg: { type: [number, 'null'], minimum: 20, maximum: 400 }
        activityLevel: { oneOf: [{ $ref: '#/components/schemas/ActivityLevel' }, { type: 'null' }] }
        experienceLevel: { oneOf: [{ $ref: '#/components/schemas/ExperienceLevel' }, { type: 'null' }] }
        dietPreference: { oneOf: [{ $ref: '#/components/schemas/DietPreference' }, { type: 'null' }] }
        unitSystem: { $ref: '#/components/schemas/UnitSystem' }
        timezone: { type: string, maxLength: 64 }
        dailyCalorieTargetKcal: { type: [integer, 'null'], minimum: 800, maximum: 6000 }
        dailyWaterTargetMl: { type: [integer, 'null'], minimum: 250, maximum: 10000 }
        onboardingCompleted: { type: boolean }
    DataExport:
      type: object
      required: [exportedAt, user]
      properties:
        exportedAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
        profile: { $ref: '#/components/schemas/Profile' }
        goals: { type: array, items: { $ref: '#/components/schemas/Goal' } }
        workoutPlans: { type: array, items: { $ref: '#/components/schemas/WorkoutPlan' } }
        workoutSessions: { type: array, items: { $ref: '#/components/schemas/WorkoutSession' } }
        customFoods: { type: array, items: { $ref: '#/components/schemas/Food' } }
        foodLogs: { type: array, items: { $ref: '#/components/schemas/FoodLog' } }
        waterLogs: { type: array, items: { $ref: '#/components/schemas/WaterLog' } }
        bodyMeasurements: { type: array, items: { $ref: '#/components/schemas/BodyMeasurement' } }
        xpLedger: { type: array, items: { $ref: '#/components/schemas/XpTransaction' } }

    GoalType:
      type: string
      enum: [lose_weight, gain_muscle, maintain, improve_endurance, workouts_per_week]
    GoalStatus:
      type: string
      enum: [active, achieved, abandoned]
    Goal:
      type: object
      required: [id, type, status, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/GoalType' }
        status: { $ref: '#/components/schemas/GoalStatus' }
        targetValue: { type: [number, 'null'], description: 'kg for weight goals, count for workouts_per_week' }
        startValue: { type: [number, 'null'] }
        targetDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GoalCreate:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/GoalType' }
        targetValue: { type: [number, 'null'], minimum: 0 }
        startValue: { type: [number, 'null'], minimum: 0 }
        targetDate: { type: [string, 'null'], format: date }
    GoalUpdate:
      type: object
      properties:
        status: { $ref: '#/components/schemas/GoalStatus' }
        targetValue: { type: [number, 'null'], minimum: 0 }
        targetDate: { type: [string, 'null'], format: date }

    MuscleGroup:
      type: string
      enum: [chest, back, shoulders, biceps, triceps, forearms, core, quads, hamstrings, glutes, calves, full_body, cardio]
    Equipment:
      type: string
      enum: [none, dumbbell, barbell, kettlebell, machine, cable, resistance_band, bench, pull_up_bar, other]
    TrackingType:
      type: string
      enum: [reps_weight, reps, duration, distance_duration]
      description: Which set fields apply
    Exercise:
      type: object
      required: [id, slug, name, primaryMuscle, secondaryMuscles, equipment, trackingType, difficulty]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { type: string }
        name: { type: string }
        nameHi: { type: [string, 'null'], description: Hindi name }
        primaryMuscle: { $ref: '#/components/schemas/MuscleGroup' }
        secondaryMuscles: { type: array, items: { $ref: '#/components/schemas/MuscleGroup' } }
        equipment: { type: array, items: { $ref: '#/components/schemas/Equipment' } }
        trackingType: { $ref: '#/components/schemas/TrackingType' }
        difficulty: { $ref: '#/components/schemas/ExperienceLevel' }
        instructions: { type: array, items: { type: string } }
        videoUrl: { type: [string, 'null'], format: uri }

    PlanGenerateRequest:
      type: object
      required: [goal, experienceLevel, daysPerWeek, sessionMinutes]
      properties:
        goal: { $ref: '#/components/schemas/GoalType' }
        experienceLevel: { $ref: '#/components/schemas/ExperienceLevel' }
        daysPerWeek: { type: integer, minimum: 1, maximum: 7 }
        sessionMinutes: { type: integer, minimum: 15, maximum: 180 }
        equipment:
          type: array
          items: { $ref: '#/components/schemas/Equipment' }
          description: Available equipment; empty or omitted means bodyweight only
        weeks: { type: integer, minimum: 1, maximum: 16, default: 4 }
    PlannedExercise:
      type: object
      required: [exerciseId, order, sets]
      properties:
        exerciseId: { $ref: '#/components/schemas/Id' }
        order: { type: integer, minimum: 0 }
        sets: { type: integer, minimum: 1, maximum: 20 }
        repsMin: { type: [integer, 'null'], minimum: 1, maximum: 100 }
        repsMax: { type: [integer, 'null'], minimum: 1, maximum: 100 }
        durationSeconds: { type: [integer, 'null'], minimum: 1, maximum: 7200 }
        targetWeightKg: { type: [number, 'null'], minimum: 0, maximum: 1000 }
        restSeconds: { type: integer, minimum: 0, maximum: 600, default: 90 }
        notes: { type: [string, 'null'], maxLength: 500 }
    PlannedWorkout:
      type: object
      required: [dayOfWeek, name, exercises]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        dayOfWeek: { type: integer, minimum: 1, maximum: 7, description: 'ISO weekday, 1 = Monday' }
        name: { type: string, maxLength: 80 }
        exercises:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/PlannedExercise' }
    WorkoutPlanDraft:
      $ref: './schemas/workout-plan-draft.schema.json'
    WorkoutPlanUpdate:
      allOf:
        - $ref: '#/components/schemas/WorkoutPlanDraft'
        - type: object
          required: [baseVersion]
          properties:
            baseVersion: { type: integer, minimum: 1 }
    WorkoutPlan:
      type: object
      required: [id, version, name, weeks, workouts, isActive, source, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        weeks: { type: integer }
        workouts: { type: array, items: { $ref: '#/components/schemas/PlannedWorkout' } }
        isActive: { type: boolean }
        source: { type: string, enum: [rule_based, custom] }
        createdAt: { type: string, format: date-time }

    SessionStatus:
      type: string
      enum: [in_progress, paused, completed]
    SessionStart:
      type: object
      properties:
        plannedWorkoutId: { $ref: '#/components/schemas/Id' }
        planVersion: { type: integer, minimum: 1 }
        startedAt: { type: string, format: date-time, description: Client time for offline starts; defaults to server time }
    SessionUpdate:
      type: object
      properties:
        status: { type: string, enum: [in_progress, paused] }
        notes: { type: [string, 'null'], maxLength: 1000 }
    SessionComplete:
      type: object
      properties:
        completedAt: { type: string, format: date-time }
        perceivedDifficulty: { type: integer, minimum: 1, maximum: 5, description: '1 = too easy, 5 = too hard' }
        notes: { type: [string, 'null'], maxLength: 1000 }
    SetLogUpsert:
      type: object
      required: [clientSetId, exerciseId, setIndex, completed]
      properties:
        clientSetId: { type: string, format: uuid, description: Generated on the device; the upsert key }
        exerciseId: { $ref: '#/components/schemas/Id' }
        setIndex: { type: integer, minimum: 0, maximum: 50 }
        reps: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
        weightKg: { type: [number, 'null'], minimum: 0, maximum: 1000 }
        durationSeconds: { type: [integer, 'null'], minimum: 0, maximum: 86400 }
        distanceM: { type: [number, 'null'], minimum: 0, maximum: 1000000 }
        completed: { type: boolean }
        loggedAt: { type: string, format: date-time }
    SetLog:
      allOf:
        - $ref: '#/components/schemas/SetLogUpsert'
        - type: object
          required: [id, updatedAt]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            updatedAt: { type: string, format: date-time }
    WorkoutSession:
      type: object
      required: [id, status, startedAt, sets, activeSeconds]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        planId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        planVersion: { type: [integer, 'null'] }
        plannedWorkoutId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/SessionStatus' }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        activeSeconds: { type: integer, minimum: 0, description: Excludes paused time }
        perceivedDifficulty: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        notes: { type: [string, 'null'] }
        sets: { type: array, items: { $ref: '#/components/schemas/SetLog' } }
    SessionCompleteResult:
      type: object
      required: [session, xpAwarded, xpBalance]
      properties:
        session: { $ref: '#/components/schemas/WorkoutSession' }
        xpAwarded:
          type: integer
          minimum: 0
          description: XP from this completion; the original amount on a replay. A reversed award is never re-awarded.
        xpBalance: { $ref: '#/components/schemas/XpBalance' }

    MealType:
      type: string
      enum: [breakfast, lunch, dinner, snack]
    Nutrients:
      type: object
      description: Per one `servingSize` of `servingUnit`
      required: [energyKcal, proteinG, carbsG, fatG]
      properties:
        energyKcal: { type: number, minimum: 0 }
        proteinG: { type: number, minimum: 0 }
        carbsG: { type: number, minimum: 0 }
        fatG: { type: number, minimum: 0 }
        fiberG: { type: [number, 'null'], minimum: 0 }
        sugarG: { type: [number, 'null'], minimum: 0 }
        sodiumMg: { type: [number, 'null'], minimum: 0 }
    ServingUnit:
      type: string
      enum: [g, ml, piece, katori, cup, tbsp, tsp, plate, glass, slice]
      description: Indian household measures (katori, plate, glass) alongside metric
    Food:
      type: object
      required: [id, name, servingSize, servingUnit, gramsPerServing, nutrients, source]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        nameHi: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        servingSize: { type: number, exclusiveMinimum: 0 }
        servingUnit: { $ref: '#/components/schemas/ServingUnit' }
        gramsPerServing: { type: [number, 'null'], exclusiveMinimum: 0, description: Weight of one serving when known }
        nutrients: { $ref: '#/components/schemas/Nutrients' }
        isVegetarian: { type: [boolean, 'null'] }
        source: { type: string, enum: [catalog, custom] }
    FoodCreate:
      type: object
      required: [name, servingSize, servingUnit, nutrients]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        brand: { type: [string, 'null'], maxLength: 80 }
        servingSize: { type: number, exclusiveMinimum: 0, maximum: 10000 }
        servingUnit: { $ref: '#/components/schemas/ServingUnit' }
        gramsPerServing: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 10000 }
        nutrients: { $ref: '#/components/schemas/Nutrients' }
        isVegetarian: { type: [boolean, 'null'] }
    FoodLog:
      type: object
      required: [id, foodId, foodName, date, mealType, servings, nutrients, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        foodId: { $ref: '#/components/schemas/Id' }
        foodName: { type: string }
        date: { type: string, format: date }
        mealType: { $ref: '#/components/schemas/MealType' }
        servings: { type: number, exclusiveMinimum: 0 }
        nutrients:
          allOf: [{ $ref: '#/components/schemas/Nutrients' }]
          description: Totals for this entry (servings applied, or the user's edited values)
        nutrientsEdited: { type: boolean, description: True when the user overrode the computed macros }
        createdAt: { type: string, format: date-time }
    FoodLogCreate:
      type: object
      required: [foodId, date, mealType, servings]
      properties:
        foodId: { $ref: '#/components/schemas/Id' }
        date: { type: string, format: date }
        mealType: { $ref: '#/components/schemas/MealType' }
        servings: { type: number, exclusiveMinimum: 0, maximum: 100 }
        nutrientsOverride: { $ref: '#/components/schemas/Nutrients' }
    FoodLogUpdate:
      type: object
      properties:
        mealType: { $ref: '#/components/schemas/MealType' }
        servings: { type: number, exclusiveMinimum: 0, maximum: 100 }
        nutrientsOverride:
          oneOf: [{ $ref: '#/components/schemas/Nutrients' }, { type: 'null' }]
          description: null restores the computed values
    WaterLog:
      type: object
      required: [id, date, amountMl, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        date: { type: string, format: date }
        amountMl: { type: integer, minimum: 1, maximum: 5000 }
        createdAt: { type: string, format: date-time }
    WaterLogCreate:
      type: object
      required: [date, amountMl]
      properties:
        date: { type: string, format: date }
        amountMl: { type: integer, minimum: 1, maximum: 5000 }
    DailyNutrition:
      type: object
      required: [date, totals, byMeal, waterMl]
      properties:
        date: { type: string, format: date }
        totals: { $ref: '#/components/schemas/Nutrients' }
        byMeal:
          type: object
          required: [breakfast, lunch, dinner, snack]
          properties:
            breakfast: { $ref: '#/components/schemas/Nutrients' }
            lunch: { $ref: '#/components/schemas/Nutrients' }
            dinner: { $ref: '#/components/schemas/Nutrients' }
            snack: { $ref: '#/components/schemas/Nutrients' }
        waterMl: { type: integer, minimum: 0 }
        calorieTargetKcal: { type: [integer, 'null'] }
        waterTargetMl: { type: [integer, 'null'] }

    BodyMeasurement:
      type: object
      required: [id, date, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        date: { type: string, format: date }
        weightKg: { type: [number, 'null'] }
        bodyFatPct: { type: [number, 'null'] }
        waistCm: { type: [number, 'null'] }
        chestCm: { type: [number, 'null'] }
        hipCm: { type: [number, 'null'] }
        armCm: { type: [number, 'null'] }
        thighCm: { type: [number, 'null'] }
        createdAt: { type: string, format: date-time }
    BodyMeasurementCreate:
      type: object
      required: [date]
      minProperties: 2
      description: '`date` plus at least one measurement'
      properties:
        date: { type: string, format: date }
        weightKg: { type: [number, 'null'], minimum: 20, maximum: 400 }
        bodyFatPct: { type: [number, 'null'], minimum: 2, maximum: 70 }
        waistCm: { type: [number, 'null'], minimum: 30, maximum: 250 }
        chestCm: { type: [number, 'null'], minimum: 30, maximum: 250 }
        hipCm: { type: [number, 'null'], minimum: 30, maximum: 250 }
        armCm: { type: [number, 'null'], minimum: 10, maximum: 100 }
        thighCm: { type: [number, 'null'], minimum: 20, maximum: 150 }
    ProgressPoint:
      type: object
      required: [date, weightKg, workoutsCompleted, activeMinutes, energyKcal, xpEarned]
      properties:
        date: { type: string, format: date }
        weightKg: { type: [number, 'null'], description: null = not measured that day }
        workoutsCompleted: { type: integer, minimum: 0 }
        activeMinutes: { type: integer, minimum: 0 }
        energyKcal: { type: [number, 'null'], description: null = nothing logged that day }
        xpEarned: { type: integer, minimum: 0 }
    ProgressSummary:
      type: object
      required: [from, to, points, streakDays]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        points: { type: array, items: { $ref: '#/components/schemas/ProgressPoint' } }
        streakDays: { type: integer, minimum: 0, description: Consecutive days ending today with a completed workout }

    XpSourceType:
      type: string
      enum: [workout_session, adjustment]
      description: MVP sources. `adjustment` is a server-side reversal or correction, never a client write.
    XpTransaction:
      type: object
      required: [id, sourceType, sourceId, amount, reason, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sourceType: { $ref: '#/components/schemas/XpSourceType' }
        sourceId: { $ref: '#/components/schemas/Id' }
        amount: { type: integer, description: Negative for reversals }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    XpBalance:
      type: object
      required: [total, level, xpIntoLevel, xpForNextLevel]
      properties:
        total: { type: integer, minimum: 0 }
        level: { type: integer, minimum: 1 }
        xpIntoLevel: { type: integer, minimum: 0 }
        xpForNextLevel: { type: integer, minimum: 1 }
