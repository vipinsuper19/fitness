openapi: 3.1.0
info:
  title: Fitness API
  version: 1.0.0
  summary: Lean MVP API for the Fitness Android app (India first).
  description: |
    Source of truth for `/api/v1`. The backend's generated Swagger is checked
    against this file and the Android client is built from it.

    **Conventions**
    - **Auth:** email and password. The server issues its own JWTs: a
      15-minute access token (`Authorization: Bearer`) and a rotating refresh
      token. A refresh token is single-use; reusing one revokes its family.
    - **Units:** canonical metric (kg, cm, ml, kcal, grams of macros). The
      client converts for display. Money, when it appears, is INR in paise
      (integer) with `currency: INR`.
    - **Dates:** `date` is a local calendar date (YYYY-MM-DD) in the user's
      timezone (default `Asia/Kolkata`); `date-time` is RFC 3339 with offset.
    - **Missing vs zero:** a `null` metric means "no data", never 0.
    - **Errors:** every non-2xx body is `Error`; `requestId` matches the
      `X-Request-Id` response header.
    - **Idempotency:** every write (POST, PUT, PATCH, DELETE) accepts an
      `Idempotency-Key` header (a client UUID). It is **required** on
      endpoints that can award XP or create rows the client retries offline.
      A replay with the same key and body returns the stored response with
      `Idempotent-Replayed: true`. The same key with a different body is
      `409 IDEMPOTENCY_KEY_REUSED`; a replay while the first request is still
      running is `409 IDEMPOTENCY_IN_PROGRESS`. Keys are kept for 24 hours and
      are scoped to the user.
      - A key is bound to the method, path and body hash of its first request.
        Reusing it on a **different method or path** is
        `409 IDEMPOTENCY_KEY_REUSED`; it is never replayed against another
        endpoint.
      - **Token-bearing responses are never stored.** `/auth/login` and
        `/auth/refresh` do not use idempotency keys, and `/auth/register` uses
        its key only to reject a concurrent duplicate
        (`409 IDEMPOTENCY_IN_PROGRESS`). A register replay after the first
        request finished re-runs the request: it returns `409 EMAIL_TAKEN` if
        the account was created (sign in instead), or fresh tokens if it was
        not. Tokens are never replayed from storage.
      - Rows tied to an account are erased with the account.
    - **XP:** awarded only by the server (workout completion in the MVP).
      There is no client endpoint that writes XP. The ledger is unique per
      `(userId, sourceType, sourceId)`, so retries never double-award.
      A reversal is a negative `adjustment` entry whose `sourceId` is the
      reversed entry. A reversed award is **never re-awarded**: the original
      entry stays in the ledger, so completing, replaying or re-completing
      the same session awards nothing, and an entry can be reversed only once.
    - **Ownership:** every user-owned resource is checked; another user's
      id returns `404 NOT_FOUND`, never 403, so ids are not enumerable.
    - **AI:** there is no AI provider in the MVP. "Generate" endpoints use
      deterministic rule-based fallbacks and say so in `generator`.
    - **Pagination:** cursor based: `?cursor&limit` → `{ items, nextCursor }`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://fitness-api.onrender.com/api/v1
    description: Render (production)
  - url: http://localhost:3000/api/v1
    description: Local
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Email and password sign-in with self-issued JWTs
  - name: me
    description: Account, profile, export and deletion
  - name: goals
    description: Fitness goals
  - name: exercises
    description: Seeded, read-only exercise catalog
  - name: workout-plans
    description: Rule-based or custom plans, versioned
  - name: workout-sessions
    description: Workout tracking, set logs and completion (awards XP)
  - name: nutrition
    description: Foods, food logs, water and daily totals
  - name: progress
    description: Body measurements and progress summary
  - name: xp
    description: Server-authoritative XP ledger (read-only)

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account with email and password
      description: |
        `Idempotency-Key` only rejects a concurrent duplicate
        (`409 IDEMPOTENCY_IN_PROGRESS`). The response holds tokens, so it is
        never stored or replayed. Retrying after the first request finished
        returns `409 EMAIL_TAKEN` when the account exists (sign in instead),
        or `201` with fresh tokens when the first attempt did not create it.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: '`EMAIL_TAKEN` (also on a retry after a successful sign-up), `IDEMPOTENCY_IN_PROGRESS`, or `IDEMPOTENCY_KEY_REUSED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: Takes no `Idempotency-Key`; token responses are never stored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`INVALID_CREDENTIALS` (same response for unknown email and wrong password)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Rotate the refresh token and get a new access token
      description: The presented refresh token is revoked. Reusing a revoked token revokes the whole family (`REFRESH_TOKEN_REUSED`). Takes no `Idempotency-Key`; token responses are never stored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: '`REFRESH_TOKEN_INVALID`, `REFRESH_TOKEN_EXPIRED` or `REFRESH_TOKEN_REUSED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke a refresh token (this device)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Signed out (also returned for an already revoked token) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    delete:
      tags: [me]
      operationId: deleteAccount
      summary: Delete the account and all user data
      description: Requires the current password. Revokes every token; data is erased, not soft-deleted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`INVALID_PASSWORD`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/export:
    get:
      tags: [me]
      operationId: exportMyData
      summary: Export all of the user's data as JSON
      responses:
        '200':
          description: Full export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/profile:
    get:
      tags: [me]
      operationId: getProfile
      summary: Get the profile
      responses:
        '200':
          description: Profile (fields are null until onboarding sets them)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [me]
      operationId: updateProfile
      summary: Replace the profile (onboarding and edit)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /goals:
    get:
      tags: [goals]
      operationId: listGoals
      summary: List goals
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/GoalStatus' }
      responses:
        '200':
          description: Goals, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Goal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [goals]
      operationId: createGoal
      summary: Create a goal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /goals/{goalId}:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      tags: [goals]
      operationId: getGoal
      summary: Get a goal
      responses:
        '200':
          description: Goal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [goals]
      operationId: updateGoal
      summary: Update a goal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
    delete:
      tags: [goals]
      operationId: deleteGoal
      summary: Delete a goal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exercises:
    get:
      tags: [exercises]
      operationId: listExercises
      summary: Search the seeded, read-only exercise catalog
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
        - name: muscle
          in: query
          schema: { $ref: '#/components/schemas/MuscleGroup' }
        - name: equipment
          in: query
          schema: { $ref: '#/components/schemas/Equipment' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of exercises
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Exercise' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /exercises/{exerciseId}:
    get:
      tags: [exercises]
      operationId: getExercise
      summary: Get an exercise
      parameters:
        - $ref: '#/components/parameters/ExerciseId'
      responses:
        '200':
          description: Exercise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercise' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workout-plans/generate:
    post:
      tags: [workout-plans]
      operationId: generateWorkoutPlan
      summary: Build a draft plan (rule-based in the MVP; never persisted)
      description: Pure function of the request and the catalog. Same input gives the same draft. Save it with `POST /workout-plans`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanGenerateRequest' }
      responses:
        '200':
          description: Draft plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlanDraft' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /workout-plans:
    post:
      tags: [workout-plans]
      operationId: createWorkoutPlan
      summary: Save a plan (from a draft or custom) as version 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutPlanDraft' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /workout-plans/active:
    get:
      tags: [workout-plans]
      operationId: getActiveWorkoutPlan
      summary: Get the active plan
      responses:
        '200':
          description: The active plan (latest version)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlan' }
        '204': { description: No active plan }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workout-plans/{planId}:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [workout-plans]
      operationId: getWorkoutPlan
      summary: Get a plan version
      parameters:
        - name: version
          in: query
          description: A specific version; latest when omitted
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [workout-plans]
      operationId: updateWorkoutPlan
      summary: Edit a plan by creating a new version
      description: Earlier versions stay readable, so logged sessions keep pointing at the version they followed. `baseVersion` must be the latest version or the call fails with `409 VERSION_CONFLICT`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutPlanUpdate' }
      responses:
        '200':
          description: New version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`VERSION_CONFLICT`, or an idempotency conflict'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workout-plans/{planId}/activate:
    post:
      tags: [workout-plans]
      operationId: activateWorkoutPlan
      summary: Make this plan the active one (deactivates the previous)
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workout-sessions:
    post:
      tags: [workout-sessions]
      operationId: startWorkoutSession
      summary: Start a session (optionally from a planned workout)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionStart' }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /workout-sessions/history:
    get:
      tags: [workout-sessions]
      operationId: listWorkoutHistory
      summary: List completed sessions
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Completed sessions, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WorkoutSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workout-sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [workout-sessions]
      operationId: getWorkoutSession
      summary: Get a session with its sets
      responses:
        '200':
          description: Session with its sets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [workout-sessions]
      operationId: updateWorkoutSession
      summary: Pause or resume a session, or edit notes
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SESSION_COMPLETED` (completed sessions are read-only), or an idempotency conflict'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workout-sessions/{sessionId}/sets:
    post:
      tags: [workout-sessions]
      operationId: upsertSetLog
      summary: Log or correct a set (upsert by the client's set UUID)
      description: The client-generated `clientSetId` makes this safe to retry from offline sync. Sending the same `clientSetId` again replaces that set.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLogUpsert' }
      responses:
        '200':
          description: Set stored (created or replaced)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SESSION_COMPLETED`, or an idempotency conflict'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /workout-sessions/{sessionId}/complete:
    post:
      tags: [workout-sessions]
      operationId: completeWorkoutSession
      summary: Finish a session; the only call that awards workout XP
      description: |
        XP is computed and written by the server in the same transaction.
        A retry (same key) or a second completion returns the original result
        and never awards XP twice.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionComplete' }
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionCompleteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: '`SESSION_EMPTY` (no completed sets)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /foods/search:
    get:
      tags: [nutrition]
      operationId: searchFoods
      summary: Search the seeded catalog (Indian foods first) and the user's custom foods
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of foods
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Food' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /foods:
    post:
      tags: [nutrition]
      operationId: createCustomFood
      summary: Create a custom food
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoodCreate' }
      responses:
        '201':
          description: Created (visible only to this user)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Food' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /food-logs:
    get:
      tags: [nutrition]
      operationId: listFoodLogs
      summary: List food log entries for a day
      parameters:
        - $ref: '#/components/parameters/DateRequired'
      responses:
        '200':
          description: Entries for the day
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FoodLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [nutrition]
      operationId: createFoodLog
      summary: Log a food
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
