        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoodLogUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
    delete:
      tags: [nutrition]
      operationId: deleteFoodLog
      summary: Delete a food log entry
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted (also for an already deleted entry) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /water-logs:
    get:
      tags: [nutrition]
      operationId: listWaterLogs
