  /nutrition/summary:
    get:
      tags: [nutrition]
      operationId: getNutritionSummary
      summary: Nutrition totals and averages by day, week or month
      description: |
        Read-only; no XP and no Idempotency-Key. Same range rules as `/progress/summary`: `from` must be on or before `to`,
        at most 366 days, dates within years 1900–2100 (otherwise `400`). Days are local dates in the profile timezone.
        `week` periods start on Monday and `month` periods are calendar months; the first and last periods are clipped to
        `from`/`to`, and `period` is the first date of the (clipped) period. Every period in the range is returned.
        `null` means nothing logged, never 0. Food logs count with the nutrients snapshotted at log time, including logs of
        foods that were later deleted. Rules and rounding: `docs/specs/nutrition-summary.md`.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: bucket
          in: query
          required: false
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        '200':
          description: One point per period, in date order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NutritionSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
