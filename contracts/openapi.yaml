        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoodLogCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /food-logs/{foodLogId}:
    parameters:
      - $ref: '#/components/parameters/FoodLogId'
    patch:
      tags: [nutrition]
      operationId: updateFoodLog
