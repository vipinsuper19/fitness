name: backend

on:
  pull_request:
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitness_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitness_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fitness_test
      NODE_ENV: test
      # Throwaway values for the CI database and tests only; not real secrets.
      JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - name: Check for package.json
        id: guard
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No package.json in backend/ yet; skipping."; fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        if: steps.guard.outputs.present == 'true'
        run: npm ci
      - name: Prisma generate and migrate
        if: steps.guard.outputs.present == 'true' && hashFiles('backend/prisma/schema.prisma') != ''
        run: npx prisma generate && npx prisma migrate deploy
      - name: Lint
        if: steps.guard.outputs.present == 'true'
        run: npm run lint --if-present
      - name: Contract lint (contracts/openapi.yaml)
        if: steps.guard.outputs.present == 'true'
        run: npm run contract:lint --if-present
      - name: Typecheck
        if: steps.guard.outputs.present == 'true'
        run: npm run typecheck --if-present
      - name: Test
        if: steps.guard.outputs.present == 'true'
        run: npm test --if-present
      - name: Build
        if: steps.guard.outputs.present == 'true'
        run: npm run build --if-present
      - name: Docker build
        if: steps.guard.outputs.present == 'true' && hashFiles('backend/Dockerfile') != ''
        run: docker build -t fitness-api:ci .
