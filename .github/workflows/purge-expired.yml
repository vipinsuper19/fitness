name: purge-expired

# Manually purges expired rows in the database behind secrets.FITNESS_DATABASE_URL: `npm run purge:expired`
# (src/maintenance/purge-expired.ts): idempotency_keys past their 24 h TTL, and refresh_tokens revoked or expired
# more than 7 days ago in families with no live token, and notification_sends in a final state (sent/failed) older than
# 90 days (skipped while the table doesn't exist). Windows: repository variables PURGE_REFRESH_TOKEN_MARGIN_DAYS
# (min 1) and PURGE_NOTIFICATION_SENDS_DAYS (min 30); see docs/specs/data-retention.md. DRY RUN unless the `execute` input is true. Never runs
# automatically (no schedule). Prints counts and cutoffs only; never token values, hashes or the URL.
# Running it against production (especially execute=true) needs Vipin's explicit OK, in his own words.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Delete rows (false = dry run, counts only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: purge-expired
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DATABASE_URL is set per step, only where the database is used (never during npm ci).
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Check secret
        env:
          DATABASE_URL: ${{ secrets.FITNESS_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Repository secret FITNESS_DATABASE_URL is not set."; exit 1; fi
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Purge expired rows
        env:
          DATABASE_URL: ${{ secrets.FITNESS_DATABASE_URL }}
          EXECUTE: ${{ inputs.execute }}
          PURGE_REFRESH_TOKEN_MARGIN_DAYS: ${{ vars.PURGE_REFRESH_TOKEN_MARGIN_DAYS }}
          PURGE_NOTIFICATION_SENDS_DAYS: ${{ vars.PURGE_NOTIFICATION_SENDS_DAYS }}
        run: |
          args=()
          if [ "$EXECUTE" = "true" ]; then args+=(-- --execute); fi
          npm run purge:expired "${args[@]}" 2>&1 | sed -E 's#postgres(ql)?://[^[:space:]]*#[REDACTED]#g'; exit "${PIPESTATUS[0]}"
        shell: bash
