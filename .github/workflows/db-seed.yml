name: db-seed

# Manually seeds the read-only catalogs (exercises, foods) in the database
# behind secrets.FITNESS_DATABASE_URL. The seed is idempotent (upserts on
# deterministic ids) and never touches user data. The URL is never printed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DATABASE_URL is set per step, only where the database is used (never during npm ci).
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Check secret
        env:
          DATABASE_URL: ${{ secrets.FITNESS_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.FITNESS_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Repository secret FITNESS_DATABASE_URL is not set."; exit 1; fi
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Count before
        env:
          DATABASE_URL: ${{ secrets.FITNESS_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.FITNESS_DATABASE_URL }}
        run: node scripts/db-counts.cjs before
      # The seed imports the generated client (src/generated, git-ignored).
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Seed
        env:
          DATABASE_URL: ${{ secrets.FITNESS_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.FITNESS_DATABASE_URL }}
        run: npm run db:seed 2>&1 | sed -E 's#postgres(ql)?://[^[:space:]]*#[REDACTED]#g'; exit "${PIPESTATUS[0]}"
        shell: bash
      - name: Count after
        env:
          DATABASE_URL: ${{ secrets.FITNESS_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.FITNESS_DATABASE_URL }}
        run: node scripts/db-counts.cjs after
