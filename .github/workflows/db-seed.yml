name: db-seed

# Manually seeds the read-only catalogs (exercises, foods) in the database
# behind secrets.FITNESS_DATABASE_URL. The seed is idempotent (upserts on
# deterministic ids) and never touches user data. The URL is never printed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.FITNESS_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.FITNESS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Check secret
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Repository secret FITNESS_DATABASE_URL is not set."; exit 1; fi
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Count before
        run: node scripts/db-counts.cjs before
      - name: Seed
        run: npm run db:seed 2>&1 | sed -E 's#postgres(ql)?://[^[:space:]]*#[REDACTED]#g'; exit "${PIPESTATUS[0]}"
        shell: bash
      - name: Count after
        run: node scripts/db-counts.cjs after
