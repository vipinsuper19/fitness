name: android-e2e

# Real debug app (real Hilt modules, no fakes) on an emulator against the Render API, on free
# GitHub-hosted runners. Manual or on PRs touching this workflow / the E2E test. Uses a throwaway
# @example.invalid account generated per run (masked), and always deletes it, verifying login 401.
# No secrets, no release signing, no Play upload.
on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/android-e2e.yml", "android/app/src/androidTest/**"]

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  API: https://fitness-api-6pcc.onrender.com/api/v1

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build debug app and test APKs
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Throwaway account (masked)
        id: acct
        run: |
          E="e2e-$(openssl rand -hex 5)@example.invalid"; P="E2e-$(openssl rand -hex 12)"
          echo "::add-mask::$P"
          umask 077; printf '%s\n%s\n' "$E" "$P" > "$RUNNER_TEMP/acct"
          echo "Throwaway account: $E"
      - name: Wake the API (Render cold start)
        run: for i in 1 2 3 4 5 6; do c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "https://fitness-api-6pcc.onrender.com/health" || true); echo "health $c"; [ "$c" = 200 ] && break; sleep 10; done
      - name: Run E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            bash .github/scripts/e2e-instrument.sh "$RUNNER_TEMP/acct" || echo failed > "$RUNNER_TEMP/e2e-failed"
            mkdir -p e2e-out && adb pull /sdcard/Android/data/com.vipin.fitness/files/e2e e2e-out/ || true
            adb root || true
            sleep 3
            adb pull /data/anr e2e-out/anr || true
            adb logcat -d > e2e-out/logcat.txt || true
      - name: Report
        if: always()
        run: |
          cat e2e-out/e2e/steps.txt 2>/dev/null || echo "no step report"
          ls -la e2e-out/e2e 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-out/
          if-no-files-found: warn
      - name: Delete throwaway account and verify login 401
        if: always()
        run: bash .github/scripts/e2e-cleanup.sh "$RUNNER_TEMP/acct"
      - name: Fail if E2E failed
        if: always()
        run: test ! -f "$RUNNER_TEMP/e2e-failed"
